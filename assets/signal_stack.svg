<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>

    <!-- Heat fill -->
    <linearGradient id="heat" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Subtle scanline texture -->
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/>
      <rect y="0" width="6" height="1" fill="#0a1220" opacity="0.35"/>
    </pattern>

    <filter id="heatGlow" x="-40%" y="-80%" width="200%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="1 0 0 0 0
                0 0.55 0 0 0
                0 0 0.2 0 0
                0 0 0 0.85 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="356" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="304" rx="14" fill="#0f1622" stroke="#243244" opacity="0.98"/>
