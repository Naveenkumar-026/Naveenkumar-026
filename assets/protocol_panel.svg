<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110">
  <defs>
    <pattern id="gp" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22c55e" stroke-width="0.13" opacity="0.11"/>
    </pattern>
    <linearGradient id="lBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blob">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes bp { 0%,100%{opacity:.28} 50%{opacity:.58} }
      @keyframes db { 0%,100%{opacity:1}   50%{opacity:.1}  }
      @keyframes t1 { 0%,100%{opacity:.42} 50%{opacity:.85} }
      @keyframes t2 { 0%,100%{opacity:.28} 50%{opacity:.65} }
      @keyframes t3 { 0%,100%{opacity:.18} 50%{opacity:.45} }
      .ob { animation: bp 4.5s ease-in-out infinite; }
      .sd { animation: db 2.2s step-end   infinite; }
      .r1 { animation: t1 3.8s ease-in-out infinite; }
      .r2 { animation: t2 3.8s ease-in-out infinite .9s; }
      .r3 { animation: t3 3.8s ease-in-out infinite 1.8s; }
    </style>
    <clipPath id="cc"><rect width="900" height="110"/></clipPath>
  </defs>
  <g clip-path="url(#cc)">
    <rect width="900" height="110" fill="#020704"/>
    <rect width="900" height="110" fill="url(#gp)"/>
    <rect x="0" y="0" width="3" height="110" fill="#22c55e" opacity="0.26"/>
    <ellipse cx="225" cy="55" rx="180" ry="50" fill="#22c55e" fill-opacity="0.022" filter="url(#blob)"/>
    <ellipse cx="675" cy="55" rx="160" ry="45" fill="#22c55e" fill-opacity="0.016" filter="url(#blob)"/>
    <rect class="ob" x=".5" y=".5" width="899" height="109" fill="none" stroke="#22c55e" stroke-width=".75"/>
    <path d="M3,20 L3,3 L20,3"            fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".85"/>
    <path d="M880,3 L897,3 L897,20"       fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".85"/>
    <path d="M3,90 L3,107 L20,107"        fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".85"/>
    <path d="M880,107 L897,107 L897,90"   fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".85"/>
    <circle class="sd" cx="889" cy="12" r="3.5" fill="#22c55e"/>
    <line x1="452" y1="14" x2="452" y2="96" stroke="#22c55e" stroke-width=".4" opacity=".2"/>
    <rect x="4" y="4" width="444" height="102" fill="url(#lBg)"/>
    <text x="22" y="24" font-family="'Courier New',Courier,monospace" font-size="8.5" fill="#22c55e" opacity=".32" letter-spacing="2">PROTOCOL // 01</text>
    <line x1="22" y1="29" x2="180" y2="29" stroke="#22c55e" stroke-width=".35" opacity=".2"/>
    <text x="22" y="53" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#22c55e" filter="url(#gl)" letter-spacing="0.5">Structure precedes implementation.</text>
    <text x="22" y="70" font-family="'Courier New',Courier,monospace" font-size="10" fill="#22c55e" opacity=".5">Build durable systems.</text>
    <text x="176" y="70" font-family="'Courier New',Courier,monospace" font-size="10" fill="#22c55e" opacity=".32">  Release deliberately.</text>
    <rect x="22"  y="80" width="74" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width=".55" opacity=".38"/>
    <text x="59"  y="91.5" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity=".55">DEFENSE-FIRST</text>
    <rect x="104" y="80" width="62" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width=".55" opacity=".38"/>
    <text x="135" y="91.5" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity=".55">DELIBERATE</text>
    <rect x="174" y="80" width="52" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width=".55" opacity=".38"/>
    <text x="200" y="91.5" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity=".55">DURABLE</text>
    <text x="474" y="24" font-family="'Courier New',Courier,monospace" font-size="8.5" fill="#22c55e" opacity=".32" letter-spacing="2">OPERATIONAL STATUS</text>
    <line x1="474" y1="29" x2="640" y2="29" stroke="#22c55e" stroke-width=".35" opacity=".2"/>
    <circle cx="468" cy="46" r="2.2" fill="#22c55e" class="r1"/>
    <text x="478" y="50" font-family="'Courier New',Courier,monospace" font-size="11.5" fill="#22c55e" class="r1">Most work is exploratory.</text>
    <circle cx="468" cy="66" r="2.2" fill="#22c55e" class="r2"/>
    <text x="478" y="70" font-family="'Courier New',Courier,monospace" font-size="11.5" fill="#22c55e" class="r2">Some is operational.</text>
    <circle cx="468" cy="86" r="2.2" fill="#22c55e" class="r3"/>
    <text x="478" y="90" font-family="'Courier New',Courier,monospace" font-size="11.5" fill="#22c55e" class="r3">Almost none is announced.</text>
    <text x="884" y="104" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity=".18">SILENCIO · MAIN · 2026</text>
  </g>
</svg>
