<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100">
  <defs>
    <pattern id="gp2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#22c55e" stroke-width="0.13" opacity="0.12"/>
    </pattern>
    <filter id="gl2">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes bp2 { 0%,100%{opacity:.28} 50%{opacity:.60} }
      @keyframes db2 { 0%,100%{opacity:1} 50%{opacity:.1} }
      @keyframes tf  { 0%,100%{opacity:.55} 50%{opacity:.9} }
      .ob2  { animation: bp2 4s ease-in-out infinite; }
      .sd2  { animation: db2 2.2s step-end infinite; }
      .tf1  { animation: tf 3.5s ease-in-out infinite; }
      .tf2  { animation: tf 3.5s ease-in-out infinite .8s; }
      .tf3  { animation: tf 3.5s ease-in-out infinite 1.6s; }
    </style>
    <clipPath id="cc2"><rect width="900" height="100"/></clipPath>
  </defs>

  <g clip-path="url(#cc2)">
    <rect width="900" height="100" fill="#020704"/>
    <rect width="900" height="100" fill="url(#gp2)"/>
    <rect x="0" y="0" width="3" height="100" fill="#22c55e" opacity="0.28"/>

    <!-- Ambient glow -->
    <ellipse cx="450" cy="50" rx="360" ry="40" fill="#22c55e" fill-opacity=".012" filter="url(#glow3)"/>

    <!-- Outer border -->
    <rect class="ob2" x=".5" y=".5" width="899" height="99" fill="none" stroke="#22c55e" stroke-width=".7"/>

    <!-- Corner brackets TL -->
    <path d="M3,18 L3,3 L18,3" fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".88"/>
    <!-- TR -->
    <path d="M882,3 L897,3 L897,18" fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".88"/>
    <!-- BL -->
    <path d="M3,82 L3,97 L18,97" fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".88"/>
    <!-- BR -->
    <path d="M882,97 L897,97 L897,82" fill="none" stroke="#22c55e" stroke-width="2.2" opacity=".88"/>

    <!-- Status dot -->
    <circle class="sd2" cx="889" cy="11" r="3.5" fill="#22c55e"/>

    <!-- Vertical center divider -->
    <line x1="450" y1="12" x2="450" y2="88" stroke="#22c55e" stroke-width=".45" opacity=".22"/>

    <!-- ── LEFT: Protocol block ── -->
    <!-- Header label -->
    <text x="22" y="22" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity=".32" letter-spacing="1.5">PROTOCOL // 01</text>
    <line x1="22" y1="26" x2="200" y2="26" stroke="#22c55e" stroke-width=".4" opacity=".22"/>

    <!-- Main directive -->
    <text x="22" y="46" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="bold" fill="#22c55e" filter="url(#gl2)">Structure precedes implementation.</text>

    <!-- Sub line -->
    <text x="22" y="63" font-family="'Courier New',Courier,monospace" font-size="10" fill="#22c55e" opacity=".55">Build durable systems.</text>
    <text x="190" y="63" font-family="'Courier New',Courier,monospace" font-size="10" fill="#22c55e" opacity=".35">  Release deliberately.</text>

    <!-- Tag badges -->
    <rect x="22" y="72" width="72" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width=".6" opacity=".4"/>
    <text x="58" y="83" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity=".6">DEFENSE-FIRST</text>

    <rect x="102" y="72" width="64" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width=".6" opacity=".4"/>
    <text x="134" y="83" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity=".6">DELIBERATE</text>

    <rect x="174" y="72" width="52" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width=".6" opacity=".4"/>
    <text x="200" y="83" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity=".6">DURABLE</text>

    <!-- ── RIGHT: Status readout ── -->
    <text x="468" y="22" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity=".32" letter-spacing="1.5">OPERATIONAL STATUS</text>
    <line x1="468" y1="26" x2="640" y2="26" stroke="#22c55e" stroke-width=".4" opacity=".22"/>

    <!-- Status lines -->
    <text x="468" y="44" font-family="'Courier New',Courier,monospace" font-size="10.5" fill="#22c55e" opacity=".45" class="tf1">Most work is exploratory.</text>
    <circle cx="462" cy="40" r="2.5" fill="#22c55e" opacity=".5" class="tf1"/>

    <text x="468" y="62" font-family="'Courier New',Courier,monospace" font-size="10.5" fill="#22c55e" opacity=".45" class="tf2">Some is operational.</text>
    <circle cx="462" cy="58" r="2.5" fill="#22c55e" opacity=".5" class="tf2"/>

    <text x="468" y="80" font-family="'Courier New',Courier,monospace" font-size="10.5" fill="#22c55e" opacity=".35" class="tf3">Almost none is announced.</text>
    <circle cx="462" cy="76" r="2.5" fill="#22c55e" opacity=".35" class="tf3"/>

    <!-- Right stamp -->
    <text x="878" y="92" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity=".2">SILENCIO · MAIN BUILD · 2026</text>
  </g>
</svg>
