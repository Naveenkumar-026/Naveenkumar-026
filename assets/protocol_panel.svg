<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" width="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .bg { fill: #06000D; }
      .label { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 10px; fill: #4A0080; letter-spacing: 2px; }
      .proto-title { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 9px; fill: #660099; letter-spacing: 3px; }
      .proto-val { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 9px; fill: #BB66FF; letter-spacing: 1px; }
      .rule-num { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 8px; fill: #FF0044; letter-spacing: 1px; }
      .rule-text { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 9px; fill: #9955CC; letter-spacing: 0.8px; }
      .rule-text-hi { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 9px; fill: #CC88FF; letter-spacing: 0.8px; }
      .cmd-prompt { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 10px; fill: #FF0044; letter-spacing: 1px; }
      .cmd-text { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 10px; fill: #AA44FF; letter-spacing: 1px; }
      .cursor { fill: #AA44FF; animation: cursorBlink 1s step-end infinite; }

      .border-outer { fill: none; stroke: #FF0044; stroke-width: 1.5; filter: url(#rGlow); animation: rPulse 4s ease-in-out infinite; }
      .border-inner { fill: none; stroke: #2A0011; stroke-width: 0.5; }
      .status-dot { fill: #00FF88; animation: sBlink 2s step-end infinite; }

      .glitch-title { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 22px; font-weight: bold; fill: #FF1155; letter-spacing: 6px; }
      .glitch-title-p { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 22px; font-weight: bold; fill: #9900FF; letter-spacing: 6px; opacity: 0; animation: gT1 7s infinite; }
      .glitch-title-c { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 22px; font-weight: bold; fill: #00FFFF; letter-spacing: 6px; opacity: 0; animation: gT2 7s infinite; }

      .decor-line-r { stroke: #550011; stroke-width: 0.8; }
      .decor-line-p { stroke: #330055; stroke-width: 0.5; }

      .scan-v { fill: #FF0044; opacity: 0; animation: scanV 6s linear infinite; }

      .stat-bar { animation: sFill 2s ease-out forwards; transform-origin: left; transform: scaleX(0); }
      .stat-bar2 { animation: sFill 2s 0.3s ease-out forwards; transform-origin: left; transform: scaleX(0); }
      .stat-bar3 { animation: sFill 2s 0.6s ease-out forwards; transform-origin: left; transform: scaleX(0); }

      .ticker-text { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 8px; fill: #440022; letter-spacing: 2px; animation: tScroll 16s linear infinite; }

      .rule-reveal1 { animation: rReveal 0.5s 0.5s ease-out forwards; opacity: 0; }
      .rule-reveal2 { animation: rReveal 0.5s 0.8s ease-out forwards; opacity: 0; }
      .rule-reveal3 { animation: rReveal 0.5s 1.1s ease-out forwards; opacity: 0; }
      .rule-reveal4 { animation: rReveal 0.5s 1.4s ease-out forwards; opacity: 0; }
      .rule-reveal5 { animation: rReveal 0.5s 1.7s ease-out forwards; opacity: 0; }

      @keyframes rPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
      @keyframes sBlink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes gT1 {
        0%,85%,100%{opacity:0;transform:translate(0,0)}
        86%{opacity:0.9;transform:translate(-5px,0)}
        87%{opacity:0}
        89%{opacity:0.7;transform:translate(4px,0)}
        90%{opacity:0}
      }
      @keyframes gT2 {
        0%,87%,100%{opacity:0;transform:translate(0,0)}
        88%{opacity:0.8;transform:translate(6px,0)}
        89%{opacity:0}
      }
      @keyframes scanV {
        0%{opacity:0;transform:translateY(0)}
        8%{opacity:0.05}
        92%{opacity:0.05}
        100%{opacity:0;transform:translateY(300px)}
      }
      @keyframes sFill { from{transform:scaleX(0)} to{transform:scaleX(1)} }
      @keyframes tScroll { 0%{transform:translateX(900px)} 100%{transform:translateX(-2000px)} }
      @keyframes rReveal { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    </style>
    <filter id="rGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="statGP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9900FF"/>
      <stop offset="100%" style="stop-color:#CC44FF;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="statGR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CC0022"/>
      <stop offset="100%" style="stop-color:#FF3366;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="900" height="300" fill="#06000D"/>
  
  <!-- Grid -->
  <g opacity="0.025" stroke="#FF0044" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
  </g>

  <!-- Scan sweep -->
  <rect x="0" y="0" width="900" height="2" class="scan-v"/>

  <!-- Borders -->
  <rect x="2" y="2" width="896" height="296" rx="1" class="border-outer"/>
  <rect x="6" y="6" width="888" height="288" rx="1" class="border-inner"/>

  <!-- Corner accents - RED theme this panel -->
  <rect x="2" y="2" width="22" height="3" fill="#FF0044"/>
  <rect x="2" y="2" width="3" height="22" fill="#FF0044"/>
  <rect x="876" y="2" width="22" height="3" fill="#FF0044"/>
  <rect x="895" y="2" width="3" height="22" fill="#FF0044"/>
  <rect x="2" y="295" width="22" height="3" fill="#FF0044"/>
  <rect x="2" y="275" width="3" height="22" fill="#FF0044"/>
  <rect x="876" y="295" width="22" height="3" fill="#FF0044"/>
  <rect x="895" y="275" width="3" height="22" fill="#FF0044"/>

  <!-- Header -->
  <rect x="2" y="2" width="896" height="24" fill="#0D0008"/>
  <text x="20" y="17" class="label">PROTOCOL // 01 — OPERATIONAL DOCTRINE</text>
  <circle cx="870" cy="13" r="3" class="status-dot"/>
  <text x="878" y="16" class="label" font-size="8">ARM</text>
  <line x1="6" y1="26" x2="894" y2="26" stroke="#550011" stroke-width="0.5"/>
  <line x1="6" y1="27" x2="894" y2="27" stroke="#FF0044" stroke-width="0.3" opacity="0.4"/>

  <!-- Left accent bar -->
  <rect x="18" y="35" width="2" height="238" fill="#330011"/>
  <rect x="18" y="35" width="2" height="60" fill="#FF0044" opacity="0.7"/>

  <!-- ===================== LEFT PANEL: PROTOCOL RULES ===================== -->
  <g transform="translate(30, 44)">
    <!-- Title -->
    <text class="glitch-title">OPERATING DOCTRINE</text>
    <text class="glitch-title-p">OPERATING DOCTRINE</text>
    <text class="glitch-title-c">OPERATING DOCTRINE</text>
    <line x1="0" y1="10" x2="400" y2="10" stroke="#550011" stroke-width="0.5"/>
    <line x1="0" y1="10" x2="180" y2="10" stroke="#FF0044" stroke-width="0.8" opacity="0.5"/>
    <polygon points="180,7 194,10 180,13" fill="#FF0044" opacity="0.5"/>

    <g class="rule-reveal1">
      <text x="0" y="32" class="rule-num">01.</text>
      <text x="28" y="32" class="rule-text">Threat model </text>
      <text x="116" y="32" class="rule-text-hi">before</text>
      <text x="152" y="32" class="rule-text"> architecture. Always.</text>
    </g>
    <g class="rule-reveal2">
      <text x="0" y="50" class="rule-num">02.</text>
      <text x="28" y="50" class="rule-text">Defense is not a feature. It is the </text>
      <text x="254" y="50" class="rule-text-hi">foundation.</text>
    </g>
    <g class="rule-reveal3">
      <text x="0" y="68" class="rule-num">03.</text>
      <text x="28" y="68" class="rule-text">Signal over noise. </text>
      <text x="142" y="68" class="rule-text-hi">Precision over volume.</text>
    </g>
    <g class="rule-reveal4">
      <text x="0" y="86" class="rule-num">04.</text>
      <text x="28" y="86" class="rule-text">Systems that cannot </text>
      <text x="156" y="86" class="rule-text-hi">fail safely</text>
      <text x="218" y="86" class="rule-text"> will fail badly.</text>
    </g>
    <g class="rule-reveal5">
      <text x="0" y="104" class="rule-num">05.</text>
      <text x="28" y="104" class="rule-text">Execution is the </text>
      <text x="138" y="104" class="rule-text-hi">only metric</text>
      <text x="214" y="104" class="rule-text"> in production.</text>
    </g>
    <g class="rule-reveal1" style="animation-delay:2s">
      <text x="0" y="122" class="rule-num">06.</text>
      <text x="28" y="122" class="rule-text">Adversarial mindset. </text>
      <text x="162" y="122" class="rule-text-hi">At all times.</text>
    </g>
    <g class="rule-reveal2" style="animation-delay:2.3s">
      <text x="0" y="140" class="rule-num">07.</text>
      <text x="28" y="140" class="rule-text">Build for integrity. </text>
      <text x="152" y="140" class="rule-text-hi">Engineer for reliability.</text>
    </g>
    <g class="rule-reveal3" style="animation-delay:2.6s">
      <text x="0" y="158" class="rule-num">08.</text>
      <text x="28" y="158" class="rule-text">Complexity is a vulnerability. </text>
      <text x="228" y="158" class="rule-text-hi">Simplify ruthlessly.</text>
    </g>
  </g>

  <!-- Vertical divider -->
  <line x1="460" y1="34" x2="460" y2="276" stroke="#220011" stroke-width="0.5"/>
  <line x1="461" y1="34" x2="461" y2="276" stroke="#FF0044" stroke-width="0.2" opacity="0.3"/>

  <!-- ===================== RIGHT PANEL: TERMINAL + STATS ===================== -->
  <g transform="translate(476, 44)">
    <!-- Terminal box -->
    <rect x="0" y="0" width="400" height="130" rx="2" fill="#060008" stroke="#2A0011" stroke-width="0.8"/>
    <rect x="0" y="0" width="400" height="18" fill="#0D000A"/>
    <text x="10" y="12" class="label" font-size="8">TERMINAL // SILENCIO@APEX:~$</text>
    <circle cx="376" cy="9" r="3" fill="#FF0044" opacity="0.7"/>
    <circle cx="386" cy="9" r="3" fill="#FFAA00" opacity="0.7"/>
    <circle cx="396" cy="9" r="3" fill="#00FF88" opacity="0.7"/>

    <text x="10" y="36" class="cmd-prompt">$</text>
    <text x="22" y="36" class="cmd-text">whoami</text>
    <text x="10" y="50" class="rule-text" style="fill:#996633">naveen@silencio — systems_architect // threat_operator</text>

    <text x="10" y="66" class="cmd-prompt">$</text>
    <text x="22" y="66" class="cmd-text">cat /etc/mission</text>
    <text x="10" y="80" class="rule-text" style="fill:#996633">Build intelligent, durable systems.</text>
    <text x="10" y="93" class="rule-text" style="fill:#996633">Secure by design. Reliable by default.</text>

    <text x="10" y="110" class="cmd-prompt">$</text>
    <text x="22" y="110" class="cmd-text">status --all</text>
    <text x="10" y="124" class="cmd-prompt">_</text>
    <rect x="10" y="114" width="8" height="11" class="cursor"/>

    <!-- Stats below terminal -->
    <text x="0" y="152" class="proto-title">SYSTEM METRICS</text>
    <line x1="0" y1="158" x2="400" y2="158" stroke="#330011" stroke-width="0.5"/>

    <text x="0" y="174" class="proto-title">RELIABILITY </text>
    <text x="120" y="174" class="proto-val">////////////////////</text>
    <text x="345" y="174" class="rule-num">99%</text>
    <rect x="0" y="178" width="340" height="5" rx="1" fill="#0D0008" stroke="#2A0011" stroke-width="0.5"/>
    <g class="stat-bar"><rect x="0" y="178" width="337" height="5" rx="1" fill="url(#statGR)"/></g>

    <text x="0" y="200" class="proto-title">EXECUTION SPEED</text>
    <text x="345" y="200" class="rule-num">94%</text>
    <rect x="0" y="204" width="340" height="5" rx="1" fill="#0D0008" stroke="#2A0011" stroke-width="0.5"/>
    <g class="stat-bar2"><rect x="0" y="204" width="320" height="5" rx="1" fill="url(#statGP)"/></g>

    <text x="0" y="226" class="proto-title">THREAT COVERAGE</text>
    <text x="345" y="226" class="rule-num">97%</text>
    <rect x="0" y="230" width="340" height="5" rx="1" fill="#0D0008" stroke="#2A0011" stroke-width="0.5"/>
    <g class="stat-bar3"><rect x="0" y="230" width="330" height="5" rx="1" fill="url(#statGR)"/></g>
  </g>

  <!-- Bottom ticker -->
  <rect x="2" y="268" width="896" height="18" fill="#0D0008"/>
  <line x1="6" y1="268" x2="894" y2="268" stroke="#550011" stroke-width="0.5"/>
  <text y="280" class="ticker-text">∷ THREAT MODEL BEFORE ARCHITECTURE ∷ DEFENSE IS THE FOUNDATION ∷ SIGNAL OVER NOISE ∷ FAIL SAFELY OR FAIL BADLY ∷ EXECUTION IS THE ONLY METRIC ∷ ADVERSARIAL MINDSET ∷ INTEGRITY FIRST ∷</text>
  <text x="20" y="280" font-family="'Share Tech Mono','Courier New',monospace" font-size="7" fill="#440022">PROTO::ACTIVE</text>
  <text x="790" y="280" font-family="'Share Tech Mono','Courier New',monospace" font-size="7" fill="#440022">DOCTRINE::LOADED</text>
</svg>
