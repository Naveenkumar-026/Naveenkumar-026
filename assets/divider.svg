<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="900" height="36">
  <defs>
    <linearGradient id="lineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="65%"  stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#4ade80" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="sigGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse { 0%,100%{opacity:.7} 50%{opacity:1} }
      @keyframes rotSig { 0%{transform:rotate(0deg) scale(1)} 50%{transform:rotate(180deg) scale(1.08)} 100%{transform:rotate(360deg) scale(1)} }
      .sig { animation: pulse 3s ease-in-out infinite; transform-origin: 450px 18px; }
      .ld  { animation: pulse 3s ease-in-out infinite .4s; }
    </style>
  </defs>

  <!-- Main rule line -->
  <line x1="0" y1="18" x2="900" y2="18" stroke="url(#lineL)" stroke-width="0.7"/>

  <!-- Secondary rule (offset slightly) -->
  <line x1="0" y1="20.5" x2="900" y2="20.5" stroke="url(#lineR)" stroke-width="0.3" opacity="0.4"/>

  <!-- Center diamond sigil -->
  <g class="sig" filter="url(#sigGlow)">
    <!-- Outer diamond -->
    <path d="M450,8 L458,18 L450,28 L442,18 Z"
          fill="none" stroke="#4ade80" stroke-width="1.2" opacity="0.9"/>
    <!-- Inner diamond -->
    <path d="M450,12 L455,18 L450,24 L445,18 Z"
          fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="0.7" opacity="0.8"/>
    <!-- Center dot -->
    <circle cx="450" cy="18" r="1.8" fill="#4ade80" opacity="0.95"/>
  </g>

  <!-- Side accent ticks -->
  <line class="ld" x1="390" y1="14" x2="390" y2="22" stroke="#22c55e" stroke-width="0.6" opacity="0.5"/>
  <line class="ld" x1="384" y1="16" x2="384" y2="20" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
  <line class="ld" x1="510" y1="14" x2="510" y2="22" stroke="#22c55e" stroke-width="0.6" opacity="0.5"/>
  <line class="ld" x1="516" y1="16" x2="516" y2="20" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
</svg>
