<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40">
  <defs>
    <linearGradient id="lr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="38%"  stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="62%"  stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lr2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#4ade80" stop-opacity="0.4"/>
      <stop offset="58%"  stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="sg">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes sp { 0%,100%{opacity:.65} 50%{opacity:1} }
      @keyframes lp { 0%,100%{opacity:.7}  50%{opacity:1} }
      .sig { animation: sp 3.2s ease-in-out infinite; }
      .ln  { animation: lp 3.2s ease-in-out infinite .4s; }
    </style>
  </defs>
  <rect width="900" height="40" fill="#020704"/>
  <!-- Rule lines -->
  <line class="ln" x1="0" y1="20" x2="900" y2="20" stroke="url(#lr)"  stroke-width=".75"/>
  <line class="ln" x1="0" y1="22" x2="900" y2="22" stroke="url(#lr2)" stroke-width=".35"/>
  <!-- Diamond sigil -->
  <g class="sig" filter="url(#sg)">
    <path d="M450,10 L460,20 L450,30 L440,20 Z" fill="none" stroke="#4ade80" stroke-width="1.3" opacity=".9"/>
    <path d="M450,14 L456,20 L450,26 L444,20 Z" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-width=".65"/>
    <circle cx="450" cy="20" r="2" fill="#4ade80" opacity=".95"/>
  </g>
  <!-- Side ticks -->
  <line x1="392" y1="15" x2="392" y2="25" stroke="#22c55e" stroke-width=".6" opacity=".45" class="sig"/>
  <line x1="386" y1="17" x2="386" y2="23" stroke="#22c55e" stroke-width=".45" opacity=".28" class="sig"/>
  <line x1="508" y1="15" x2="508" y2="25" stroke="#22c55e" stroke-width=".6" opacity=".45" class="sig"/>
  <line x1="514" y1="17" x2="514" y2="23" stroke="#22c55e" stroke-width=".45" opacity=".28" class="sig"/>
</svg>
