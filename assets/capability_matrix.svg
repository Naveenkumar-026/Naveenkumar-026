  <path d="M32,68 L32,60 L50,54 L68,60 L68,68 C68,79 59,86 50,90 C41,86 32,79 32,68 Z" fill="none" stroke="#ef4444" stroke-width="1.5" opacity=".75" filter="url(#gR2)"/>
