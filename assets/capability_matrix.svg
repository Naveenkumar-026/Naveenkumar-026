  <line x1="300" y1="41" x2="300" y2="346" stroke="#a855f7" stroke-width=".4" opacity=".2"/>
  <line x1="599" y1="41" x2="599" y2="346" stroke="#a855f7" stroke-width=".4" opacity=".2"/>
