<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" width="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

      .bg-main { fill: #06000D; }
      .panel-bg { fill: #080010; }
      .label { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 10px; fill: #4A0080; letter-spacing: 2px; }
      .skill-name { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 9px; fill: #AA66FF; letter-spacing: 1.5px; }
      .skill-pct { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 9px; fill: #FF0044; letter-spacing: 1px; }
      .desc-text { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 8px; fill: #553388; letter-spacing: 0.8px; }
      .node-label { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 8px; fill: #CC88FF; letter-spacing: 1px; }
      .section-title { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 11px; fill: #8800FF; letter-spacing: 3px; }

      .bar-track { fill: #0E0018; stroke: #2A0044; stroke-width: 0.5; }
      .bar-fill-p { fill: #7700CC; }
      .bar-fill-r { fill: #BB0033; }
      .bar-glow-p { fill: #CC44FF; opacity: 0.4; }
      .bar-glow-r { fill: #FF2255; opacity: 0.4; }

      .border-outer { fill: none; stroke: #7B00FF; stroke-width: 1.5; filter: url(#bGlow); animation: bPulse 4s ease-in-out infinite; }
      .border-inner { fill: none; stroke: #2A0044; stroke-width: 0.5; }

      .corner-tri { fill: #9900FF; }
      .status-dot { fill: #00FF88; animation: blink 2s step-end infinite; }

      .glitch-head { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 20px; font-weight: bold; fill: #AA44FF; letter-spacing: 5px; }
      .glitch-head-r { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 20px; font-weight: bold; fill: #FF0044; letter-spacing: 5px; opacity: 0; animation: gHead 6s infinite; }
      .glitch-head-c { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 20px; font-weight: bold; fill: #00FFFF; letter-spacing: 5px; opacity: 0; animation: gHead2 6s infinite; }

      .scan-h { fill: #9900FF; opacity: 0; animation: scanH 5s linear infinite; }
      
      .bar1 { animation: barGrow 2s 0.2s ease-out forwards; transform-origin: left; transform: scaleX(0); }
      .bar2 { animation: barGrow 2s 0.4s ease-out forwards; transform-origin: left; transform: scaleX(0); }
      .bar3 { animation: barGrow 2s 0.6s ease-out forwards; transform-origin: left; transform: scaleX(0); }
      .bar4 { animation: barGrow 2s 0.8s ease-out forwards; transform-origin: left; transform: scaleX(0); }
      .bar5 { animation: barGrow 2s 1.0s ease-out forwards; transform-origin: left; transform: scaleX(0); }
      .bar6 { animation: barGrow 2s 1.2s ease-out forwards; transform-origin: left; transform: scaleX(0); }

      .node-pulse { animation: nodePulse 3s ease-in-out infinite; }
      .node-pulse2 { animation: nodePulse 3s 1s ease-in-out infinite; }
      .node-pulse3 { animation: nodePulse 3s 2s ease-in-out infinite; }

      .ticker-text { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 8px; fill: #440066; letter-spacing: 2px; animation: tickScroll 20s linear infinite; }

      @keyframes bPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes gHead {
        0%,88%,100%{opacity:0;transform:translate(0,0)}
        89%{opacity:0.8;transform:translate(-4px,0)}
        90%{opacity:0}
        92%{opacity:0.6;transform:translate(3px,0)}
        93%{opacity:0}
      }
      @keyframes gHead2 {
        0%,90%,100%{opacity:0;transform:translate(0,0)}
        91%{opacity:0.7;transform:translate(5px,0)}
        92%{opacity:0}
      }
      @keyframes scanH {
        0%{opacity:0;transform:translateY(0)}
        10%{opacity:0.06}
        90%{opacity:0.06}
        100%{opacity:0;transform:translateY(360px)}
      }
      @keyframes barGrow {
        from{transform:scaleX(0)}
        to{transform:scaleX(1)}
      }
      @keyframes nodePulse {
        0%,100%{opacity:0.5;r:4}
        50%{opacity:1;r:6}
      }
      @keyframes tickScroll {
        0%{transform:translateX(900px)}
        100%{transform:translateX(-2200px)}
      }
      @keyframes connFlash {
        0%,100%{opacity:0.15}
        50%{opacity:0.5}
      }
      .conn-line { stroke: #6600CC; stroke-width: 0.5; opacity: 0.15; animation: connFlash 4s ease-in-out infinite; }
      .conn-line2 { stroke: #CC0033; stroke-width: 0.5; opacity: 0.15; animation: connFlash 4s 2s ease-in-out infinite; }
    </style>
    <filter id="bGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="barGradP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9900FF;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#CC44FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF88FF;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="barGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990022;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#FF0044;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF6688;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" fill="#06000D"/>
  <rect x="2" y="2" width="896" height="356" fill="#06000D" rx="1"/>

  <!-- Grid bg -->
  <g opacity="0.025" stroke="#9900FF" stroke-width="0.5">
    <line x1="0" y1="36" x2="900" y2="36"/>
    <line x1="0" y1="72" x2="900" y2="72"/>
    <line x1="0" y1="108" x2="900" y2="108"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="216" x2="900" y2="216"/>
    <line x1="0" y1="252" x2="900" y2="252"/>
    <line x1="0" y1="288" x2="900" y2="288"/>
    <line x1="0" y1="324" x2="900" y2="324"/>
    <line x1="90" y1="0" x2="90" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="270" y1="0" x2="270" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="540" y1="0" x2="540" y2="360"/>
    <line x1="630" y1="0" x2="630" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="810" y1="0" x2="810" y2="360"/>
  </g>

  <!-- Scan sweep -->
  <rect x="0" y="0" width="900" height="2" class="scan-h"/>

  <!-- Borders -->
  <rect x="2" y="2" width="896" height="356" rx="1" class="border-outer"/>
  <rect x="6" y="6" width="888" height="348" rx="1" class="border-inner"/>

  <!-- Corner accents -->
  <rect x="2" y="2" width="22" height="3" fill="#9900FF"/>
  <rect x="2" y="2" width="3" height="22" fill="#9900FF"/>
  <rect x="876" y="2" width="22" height="3" fill="#9900FF"/>
  <rect x="895" y="2" width="3" height="22" fill="#9900FF"/>
  <rect x="2" y="355" width="22" height="3" fill="#9900FF"/>
  <rect x="2" y="335" width="3" height="22" fill="#9900FF"/>
  <rect x="876" y="355" width="22" height="3" fill="#9900FF"/>
  <rect x="895" y="335" width="3" height="22" fill="#9900FF"/>

  <!-- Header bar -->
  <rect x="2" y="2" width="896" height="24" fill="#0D0018"/>
  <text x="20" y="17" class="label">CAPABILITY MATRIX // THREAT-CLASS OPERATOR</text>
  <circle cx="870" cy="13" r="3" class="status-dot"/>
  <text x="878" y="16" class="label" font-size="8">ON</text>
  <line x1="6" y1="26" x2="894" y2="26" stroke="#3A0066" stroke-width="0.5"/>
  <line x1="6" y1="27" x2="894" y2="27" stroke="#7B00FF" stroke-width="0.3" opacity="0.4"/>

  <!-- Section header -->
  <g transform="translate(24, 48)">
    <text class="glitch-head">SKILL DEPLOYMENT MATRIX</text>
    <text class="glitch-head-r">SKILL DEPLOYMENT MATRIX</text>
    <text class="glitch-head-c">SKILL DEPLOYMENT MATRIX</text>
  </g>
  <line x1="24" y1="58" x2="550" y2="58" stroke="#3A0066" stroke-width="0.5"/>
  <line x1="24" y1="58" x2="280" y2="58" stroke="#9900FF" stroke-width="0.8" opacity="0.5"/>
  <polygon points="280,55 294,58 280,61" fill="#9900FF" opacity="0.5"/>

  <!-- ===================== LEFT: SKILL BARS ===================== -->
  <!-- Skill 1: Offensive Security -->
  <text x="24" y="80" class="skill-name">OFFENSIVE SECURITY</text>
  <text x="340" y="80" class="skill-pct">97%</text>
  <rect x="24" y="84" width="310" height="7" rx="1" class="bar-track"/>
  <g class="bar1"><rect x="24" y="84" width="300" height="7" rx="1" fill="url(#barGradR)"/></g>
  <rect x="24" y="84" width="300" height="3" rx="1" fill="#FF6688" opacity="0.15"/>

  <!-- Skill 2: Defensive Systems -->
  <text x="24" y="106" class="skill-name">DEFENSIVE SYSTEMS</text>
  <text x="340" y="106" class="skill-pct">95%</text>
  <rect x="24" y="110" width="310" height="7" rx="1" class="bar-track"/>
  <g class="bar2"><rect x="24" y="110" width="294" height="7" rx="1" fill="url(#barGradP)"/></g>
  <rect x="24" y="110" width="294" height="3" rx="1" fill="#CC88FF" opacity="0.15"/>

  <!-- Skill 3: AI Systems Architecture -->
  <text x="24" y="132" class="skill-name">AI SYSTEMS ARCHITECTURE</text>
  <text x="340" y="132" class="skill-pct">93%</text>
  <rect x="24" y="136" width="310" height="7" rx="1" class="bar-track"/>
  <g class="bar3"><rect x="24" y="136" width="288" height="7" rx="1" fill="url(#barGradR)"/></g>
  <rect x="24" y="136" width="288" height="3" rx="1" fill="#FF6688" opacity="0.15"/>

  <!-- Skill 4: OSINT -->
  <text x="24" y="158" class="skill-name">OSINT &amp; INTELLIGENCE</text>
  <text x="340" y="158" class="skill-pct">96%</text>
  <rect x="24" y="162" width="310" height="7" rx="1" class="bar-track"/>
  <g class="bar4"><rect x="24" y="162" width="297" height="7" rx="1" fill="url(#barGradP)"/></g>
  <rect x="24" y="162" width="297" height="3" rx="1" fill="#CC88FF" opacity="0.15"/>

  <!-- Skill 5: Privacy Engineering -->
  <text x="24" y="188" class="skill-name">PRIVACY ENGINEERING</text>
  <text x="340" y="188" class="skill-pct">91%</text>
  <rect x="24" y="192" width="310" height="7" rx="1" class="bar-track"/>
  <g class="bar5"><rect x="24" y="192" width="282" height="7" rx="1" fill="url(#barGradR)"/></g>
  <rect x="24" y="192" width="282" height="3" rx="1" fill="#FF6688" opacity="0.15"/>

  <!-- Skill 6: Automation & Agents -->
  <text x="24" y="214" class="skill-name">AUTOMATION &amp; AGENTS</text>
  <text x="340" y="214" class="skill-pct">94%</text>
  <rect x="24" y="218" width="310" height="7" rx="1" class="bar-track"/>
  <g class="bar6"><rect x="24" y="218" width="291" height="7" rx="1" fill="url(#barGradP)"/></g>
  <rect x="24" y="218" width="291" height="3" rx="1" fill="#CC88FF" opacity="0.15"/>

  <!-- Vertical divider -->
  <line x1="380" y1="34" x2="380" y2="320" stroke="#220033" stroke-width="0.5"/>

  <!-- ===================== RIGHT: CAPABILITY NODES ===================== -->
  <g transform="translate(400, 40)">
    <text x="0" y="16" class="section-title">THREAT TAXONOMY</text>
    <line x1="0" y1="22" x2="476" y2="22" stroke="#3A0066" stroke-width="0.5"/>

    <!-- Node grid: 3 cols x 2 rows -->
    <!-- Row 1 -->
    <!-- Node 1: Recon -->
    <rect x="0" y="30" width="148" height="72" rx="2" fill="#09000F" stroke="#3A0055" stroke-width="0.8"/>
    <rect x="0" y="30" width="148" height="14" fill="#0F0020"/>
    <text x="8" y="41" class="node-label">01 // RECON &amp; OSINT</text>
    <text x="8" y="56" class="desc-text">Passive &amp; active intel</text>
    <text x="8" y="67" class="desc-text">Surface mapping</text>
    <text x="8" y="78" class="desc-text">Target profiling</text>
    <circle cx="138" cy="90" r="5" fill="#9900FF" class="node-pulse" filter="url(#nodeGlow)" opacity="0.8"/>

    <!-- Node 2: Exploit -->
    <rect x="158" y="30" width="148" height="72" rx="2" fill="#09000F" stroke="#550011" stroke-width="0.8"/>
    <rect x="158" y="30" width="148" height="14" fill="#150009"/>
    <text x="166" y="41" class="node-label">02 // EXPLOIT &amp; PENTEST</text>
    <text x="166" y="56" class="desc-text">Vuln exploitation</text>
    <text x="166" y="67" class="desc-text">Attack simulation</text>
    <text x="166" y="78" class="desc-text">Red team ops</text>
    <circle cx="296" cy="90" r="5" fill="#FF0044" class="node-pulse2" filter="url(#nodeGlow)" opacity="0.8"/>

    <!-- Node 3: Defense -->
    <rect x="316" y="30" width="160" height="72" rx="2" fill="#09000F" stroke="#3A0055" stroke-width="0.8"/>
    <rect x="316" y="30" width="160" height="14" fill="#0F0020"/>
    <text x="324" y="41" class="node-label">03 // DEFENSE ARCH</text>
    <text x="324" y="56" class="desc-text">Threat modeling</text>
    <text x="324" y="67" class="desc-text">Hardened pipelines</text>
    <text x="324" y="78" class="desc-text">Zero-trust design</text>
    <circle cx="464" cy="90" r="5" fill="#9900FF" class="node-pulse3" filter="url(#nodeGlow)" opacity="0.8"/>

    <!-- Connection lines row 1 -->
    <line x1="148" y1="66" x2="158" y2="66" class="conn-line"/>
    <line x1="306" y1="66" x2="316" y2="66" class="conn-line2"/>

    <!-- Row 2 -->
    <!-- Node 4: AI -->
    <rect x="0" y="116" width="148" height="72" rx="2" fill="#09000F" stroke="#550011" stroke-width="0.8"/>
    <rect x="0" y="116" width="148" height="14" fill="#150009"/>
    <text x="8" y="127" class="node-label">04 // AI AGENT SYSTEMS</text>
    <text x="8" y="142" class="desc-text">LLM architecture</text>
    <text x="8" y="153" class="desc-text">Agentic pipelines</text>
    <text x="8" y="164" class="desc-text">Autonomous ops</text>
    <circle cx="138" cy="176" r="5" fill="#FF0044" class="node-pulse" filter="url(#nodeGlow)" opacity="0.8"/>

    <!-- Node 5: Privacy -->
    <rect x="158" y="116" width="148" height="72" rx="2" fill="#09000F" stroke="#3A0055" stroke-width="0.8"/>
    <rect x="158" y="116" width="148" height="14" fill="#0F0020"/>
    <text x="166" y="127" class="node-label">05 // PRIVACY ENG</text>
    <text x="166" y="142" class="desc-text">Data minimization</text>
    <text x="166" y="153" class="desc-text">Anonymization</text>
    <text x="166" y="164" class="desc-text">Compliance design</text>
    <circle cx="296" cy="176" r="5" fill="#9900FF" class="node-pulse3" filter="url(#nodeGlow)" opacity="0.8"/>

    <!-- Node 6: Automation -->
    <rect x="316" y="116" width="160" height="72" rx="2" fill="#09000F" stroke="#550011" stroke-width="0.8"/>
    <rect x="316" y="116" width="160" height="14" fill="#150009"/>
    <text x="324" y="127" class="node-label">06 // SYS AUTOMATION</text>
    <text x="324" y="142" class="desc-text">Pipeline automation</text>
    <text x="324" y="153" class="desc-text">Rapid prototyping</text>
    <text x="324" y="164" class="desc-text">Infra scripting</text>
    <circle cx="464" cy="176" r="5" fill="#FF0044" class="node-pulse2" filter="url(#nodeGlow)" opacity="0.8"/>

    <!-- Connection lines row 2 -->
    <line x1="148" y1="152" x2="158" y2="152" class="conn-line2"/>
    <line x1="306" y1="152" x2="316" y2="152" class="conn-line"/>

    <!-- Vertical connectors between rows -->
    <line x1="74" y1="102" x2="74" y2="116" class="conn-line"/>
    <line x1="232" y1="102" x2="232" y2="116" class="conn-line2"/>
    <line x1="396" y1="102" x2="396" y2="116" class="conn-line"/>
  </g>

  <!-- Bottom section -->
  <line x1="24" y1="244" x2="370" y2="244" stroke="#220033" stroke-width="0.5"/>
  <text x="24" y="258" class="desc-text">ENVIRONMENT: HIGH-STAKES // ADVERSARIAL // PRODUCTION</text>
  <text x="24" y="272" class="desc-text">METHODOLOGY: DEFENSE-FIRST // CLEAN ENG // RAPID PROTO</text>
  <text x="24" y="286" class="desc-text">BIAS: REAL-WORLD RELIABILITY // SIGNAL OVER NOISE</text>

  <!-- Additional right detail -->
  <g transform="translate(400, 236)">
    <text x="0" y="14" class="section-title">OPERATIONAL CONSTANTS</text>
    <line x1="0" y1="20" x2="476" y2="20" stroke="#3A0066" stroke-width="0.5"/>
    <text x="0" y="36" class="desc-text">∷ Adversarial mindset active at all times</text>
    <text x="0" y="50" class="desc-text">∷ Systems designed to fail safely and degrade gracefully</text>
    <text x="0" y="64" class="desc-text">∷ Threat model before architecture. Defense before features.</text>
    <text x="0" y="78" class="desc-text">∷ Execution is the only metric that matters in production.</text>
  </g>

  <!-- Bottom ticker -->
  <rect x="2" y="328" width="896" height="18" fill="#0D0018"/>
  <line x1="6" y1="328" x2="894" y2="328" stroke="#3A0066" stroke-width="0.5"/>
  <text y="340" class="ticker-text">∷ OFFENSIVE SECURITY ∷ DEFENSIVE ARCHITECTURE ∷ AI AGENT SYSTEMS ∷ OSINT &amp; INTEL ∷ PRIVACY ENGINEERING ∷ AUTOMATION ∷ THREAT MODELING ∷ RED TEAM OPS ∷ ZERO-TRUST DESIGN ∷ CLEAN CODE ∷</text>
  <text x="20" y="340" font-family="'Share Tech Mono','Courier New',monospace" font-size="7" fill="#440066">MATRIX::LOADED</text>
  <text x="800" y="340" font-family="'Share Tech Mono','Courier New',monospace" font-size="7" fill="#440066">NODES::6/6</text>
</svg>
