<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020704"/>
      <stop offset="100%" stop-color="#050d06"/>
    </linearGradient>
    <pattern id="gridP2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22c55e" stroke-width="0.15" opacity="0.14"/>
    </pattern>
    <!-- Cell gradients -->
    <linearGradient id="cellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cellBgHot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="gA">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gB">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gBlob">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip2"><rect width="900" height="360"/></clipPath>
    <style>
      @keyframes scanAnim2 {
        0%   { transform: translateY(-4px); opacity: 0; }
        8%   { opacity: 0.5; }
        92%  { opacity: 0.15; }
        100% { transform: translateY(370px); opacity: 0; }
      }
      @keyframes borderPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      @keyframes iconPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 1; r: 3; }
        50% { opacity: 0.3; r: 2; }
      }
      .scan2 { animation: scanAnim2 9s linear infinite 2s; }
      .bpulse { animation: borderPulse 4s ease-in-out infinite; }
      .bpulse2 { animation: borderPulse 4s ease-in-out infinite 1s; }
      .bpulse3 { animation: borderPulse 4s ease-in-out infinite 2s; }
      .ipulse { animation: iconPulse 3s ease-in-out infinite; }
      .ipulse2 { animation: iconPulse 3s ease-in-out infinite 1s; }
      .ipulse3 { animation: iconPulse 3s ease-in-out infinite 2s; }
      .dblink { animation: dotBlink 2s step-end infinite; }
    </style>
  </defs>

  <g clip-path="url(#clip2)">
    <!-- BG -->
    <rect width="900" height="360" fill="url(#bg2)"/>
    <rect width="900" height="360" fill="url(#gridP2)"/>

    <!-- Left accent bar -->
    <rect x="0" y="0" width="3" height="360" fill="#22c55e" opacity="0.3"/>

    <!-- Ambient glows -->
    <ellipse cx="220" cy="180" rx="200" ry="130" fill="#22c55e" fill-opacity="0.018" filter="url(#gBlob)"/>
    <ellipse cx="680" cy="180" rx="200" ry="130" fill="#22c55e" fill-opacity="0.015" filter="url(#gBlob)"/>

    <!-- Scan line -->
    <rect class="scan2" x="0" y="0" width="900" height="1.5" fill="#22c55e" opacity="0.45"/>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="899" height="359" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.32"/>

    <!-- Corner brackets TL -->
    <path d="M3,24 L3,3 L24,3" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.9"/>
    <!-- TR -->
    <path d="M876,3 L897,3 L897,24" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.9"/>
    <!-- BL -->
    <path d="M3,336 L3,357 L24,357" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.9"/>
    <!-- BR -->
    <path d="M876,357 L897,357 L897,336" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.9"/>

    <!-- Header bar -->
    <rect x="1" y="1" width="898" height="40" fill="#22c55e" fill-opacity="0.06"/>
    <line x1="1" y1="41" x2="899" y2="41" stroke="#22c55e" stroke-width="0.5" opacity="0.35"/>

    <!-- Header text -->
    <text x="18" y="25" font-family="'Courier New',Courier,monospace" font-size="9.5" fill="#22c55e" opacity="0.4">OPERATOR STACK // CAPABILITY MATRIX</text>
    <text x="316" y="26" font-family="'Courier New',Courier,monospace" font-size="13" fill="#22c55e" font-weight="bold" filter="url(#gB)">DOMAIN ARCHITECTURE // 6 VECTORS</text>
    <text x="744" y="25" font-family="'Courier New',Courier,monospace" font-size="9.5" fill="#22c55e" opacity="0.4">user: Naveenkumar-026</text>
    <!-- Active dot -->
    <circle class="dblink" cx="880" cy="21" r="3" fill="#22c55e"/>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- CELL GRID: 3 columns × 2 rows                         -->
    <!-- Col widths: 0-296, 302-596, 602-896                   -->
    <!-- Row heights: 50-194, 200-344                          -->
    <!-- ─────────────────────────────────────────────────────── -->

    <!-- ══ CELL 1: Cyber Defense (top-left) ══ -->
    <rect x="8" y="50" width="288" height="142" rx="3" fill="url(#cellBgHot)" stroke="#22c55e" stroke-width="0.8" class="bpulse"/>
    <!-- Icon: shield -->
    <path d="M38,72 L38,64 L56,58 L74,64 L74,72 C74,83 65,90 56,94 C47,90 38,83 38,72 Z"
          fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7" class="ipulse"/>
    <path d="M49,74 L54,79 L66,67" fill="none" stroke="#22c55e" stroke-width="1.8" opacity="0.8" class="ipulse"/>
    <!-- Label -->
    <text x="84" y="73" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#22c55e" font-weight="bold" filter="url(#gB)">Cyber Defense</text>
    <text x="84" y="87" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.5">PRIORITY // CRITICAL</text>
    <!-- Desc -->
    <text x="22" y="116" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Offensive and defensive architectures.</text>
    <text x="22" y="130" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Response automation. Hardening.</text>
    <text x="22" y="144" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Threat modeling. Penetration analysis.</text>
    <!-- Level bar -->
    <rect x="22" y="162" width="262" height="5" rx="1.5" fill="#22c55e" fill-opacity="0.1"/>
    <rect x="22" y="162" width="248" height="5" rx="1.5" fill="#22c55e" opacity="0.8"/>
    <text x="287" y="170" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity="0.45">95%</text>
    <!-- Cell label bottom -->
    <text x="22" y="184" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity="0.3">— defensive architectures, response automation, hardening</text>

    <!-- ══ CELL 2: Agent Systems (top-center) ══ -->
    <rect x="306" y="50" width="288" height="142" rx="3" fill="url(#cellBg)" stroke="#22c55e" stroke-width="0.8" class="bpulse2"/>
    <!-- Icon: network nodes -->
    <circle cx="372" cy="76" r="5" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7" class="ipulse2"/>
    <circle cx="362" cy="62" r="4" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7" class="ipulse2"/>
    <circle cx="384" cy="62" r="4" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7" class="ipulse2"/>
    <line x1="372" y1="71" x2="365" y2="66" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <line x1="372" y1="71" x2="380" y2="66" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <!-- Label -->
    <text x="400" y="73" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#22c55e" font-weight="bold" filter="url(#gB)">Agent Systems</text>
    <text x="400" y="87" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.5">PRIORITY // HIGH</text>
    <!-- Desc -->
    <text x="320" y="116" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Orchestration frameworks.</text>
    <text x="320" y="130" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Evaluation harnesses. Safety rails.</text>
    <text x="320" y="144" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Autonomous pipeline design.</text>
    <!-- Level bar -->
    <rect x="320" y="162" width="262" height="5" rx="1.5" fill="#22c55e" fill-opacity="0.1"/>
    <rect x="320" y="162" width="236" height="5" rx="1.5" fill="#22c55e" opacity="0.75"/>
    <text x="585" y="170" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity="0.45">90%</text>
    <text x="320" y="184" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity="0.3">— orchestration, evaluation harnesses, safety rails</text>

