    <!-- Icon: eye/magnifier -->
    <circle cx="638" cy="73" r="13" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6" class="ipulse3"/>
    <circle cx="638" cy="73" r="5" fill="#22c55e" opacity="0.25" class="ipulse3"/>
    <circle cx="638" cy="73" r="2.5" fill="#22c55e" opacity="0.6"/>
    <line x1="647" y1="82" x2="656" y2="91" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <!-- Label -->
    <text x="676" y="70" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#22c55e" font-weight="bold" filter="url(#gB)">OSINT</text>
    <text x="676" y="84" font-family="'Courier New',Courier,monospace" font-size="10" fill="#22c55e" font-weight="bold" filter="url(#gB)">&amp; Intelligence</text>
    <text x="618" y="87" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0" >x</text>
    <!-- Desc -->
    <text x="618" y="116" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Open-source intelligence gathering.</text>
    <text x="618" y="130" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Signal acquisition. Profile mapping.</text>
    <text x="618" y="144" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Digital footprint analysis.</text>
    <!-- Level bar -->
    <rect x="618" y="162" width="262" height="5" rx="1.5" fill="#22c55e" fill-opacity="0.1"/>
    <rect x="618" y="162" width="248" height="5" rx="1.5" fill="#22c55e" opacity="0.75"/>
    <text x="883" y="170" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity="0.45">95%</text>
    <text x="618" y="184" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity="0.3">— signal acquisition, open-source intelligence, profiling</text>

    <!-- ══ CELL 4: Privacy Engineering (bottom-left) ══ -->
    <rect x="8" y="204" width="288" height="142" rx="3" fill="url(#cellBg)" stroke="#22c55e" stroke-width="0.8" class="bpulse2"/>
    <!-- Icon: lock -->
    <rect x="44" y="228" width="20" height="16" rx="2" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7" class="ipulse"/>
    <path d="M47,228 C47,221 61,221 61,228" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7" class="ipulse"/>
    <circle cx="54" cy="236" r="2.5" fill="#22c55e" opacity="0.6"/>
    <!-- Label -->
    <text x="78" y="232" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#22c55e" font-weight="bold" filter="url(#gB)">Privacy Eng.</text>
    <text x="78" y="246" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.5">PRIORITY // HIGH</text>
    <!-- Desc -->
    <text x="22" y="274" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Privacy-first design patterns.</text>
    <text x="22" y="288" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Edge/off-grid deployment constraints.</text>
    <text x="22" y="302" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Zero-knowledge system design.</text>
    <!-- Level bar -->
    <rect x="22" y="320" width="262" height="5" rx="1.5" fill="#22c55e" fill-opacity="0.1"/>
    <rect x="22" y="320" width="222" height="5" rx="1.5" fill="#22c55e" opacity="0.7"/>
    <text x="287" y="328" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity="0.45">85%</text>
    <text x="22" y="340" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity="0.3">— privacy-first, edge/off-grid constraints, ZK design</text>

    <!-- ══ CELL 5: Automation (bottom-center) ══ -->
    <rect x="306" y="204" width="288" height="142" rx="3" fill="url(#cellBgHot)" stroke="#22c55e" stroke-width="0.8" class="bpulse3"/>
    <!-- Icon: gear/circuit -->
    <circle cx="360" cy="236" r="12" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6" class="ipulse2"/>
    <circle cx="360" cy="236" r="5" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7" class="ipulse2"/>
    <!-- Gear teeth approx -->
    <line x1="360" y1="220" x2="360" y2="217" stroke="#22c55e" stroke-width="2.5" opacity="0.6"/>
    <line x1="360" y1="255" x2="360" y2="252" stroke="#22c55e" stroke-width="2.5" opacity="0.6"/>
    <line x1="344" y1="236" x2="341" y2="236" stroke="#22c55e" stroke-width="2.5" opacity="0.6"/>
    <line x1="379" y1="236" x2="376" y2="236" stroke="#22c55e" stroke-width="2.5" opacity="0.6"/>
    <line x1="349" y1="225" x2="347" y2="223" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
    <line x1="373" y1="249" x2="371" y2="247" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
    <line x1="373" y1="225" x2="371" y2="223" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
    <line x1="349" y1="249" x2="347" y2="247" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
    <!-- Label -->
    <text x="386" y="232" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#22c55e" font-weight="bold" filter="url(#gB)">Automation</text>
    <text x="386" y="246" font-family="'Courier New',Courier,monospace" font-size="9" fill="#4ade80" opacity="0.7">PRIORITY // CORE</text>
    <!-- Desc -->
    <text x="320" y="274" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Intelligent workflow pipelines.</text>
    <text x="320" y="288" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Rapid prototyping with reliability.</text>
    <text x="320" y="302" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Clean engineering. Real-world bias.</text>
    <!-- Level bar -->
    <rect x="320" y="320" width="262" height="5" rx="1.5" fill="#22c55e" fill-opacity="0.1"/>
    <rect x="320" y="320" width="249" height="5" rx="1.5" fill="#4ade80" opacity="0.7"/>
    <text x="585" y="328" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#4ade80" opacity="0.5">95%</text>
    <text x="320" y="340" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity="0.3">— pipelines, rapid prototyping, clean engineering</text>

    <!-- ══ CELL 6: Long-Horizon (bottom-right) ══ -->
    <rect x="604" y="204" width="288" height="142" rx="3" fill="url(#cellBg)" stroke="#22c55e" stroke-width="0.8" class="bpulse"/>
    <!-- Icon: infinity/horizon arrow -->
    <path d="M622,236 C622,230 630,226 638,236 C646,246 654,242 654,236 C654,230 646,226 638,236 C630,246 622,242 622,236 Z"
          fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.65" class="ipulse3"/>
    <!-- Label -->
    <text x="670" y="232" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#22c55e" font-weight="bold" filter="url(#gB)">Long-Horizon</text>
    <text x="670" y="246" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.5">PRIORITY // STRATEGIC</text>
    <!-- Desc -->
    <text x="618" y="274" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Durable primitives before scale.</text>
    <text x="618" y="288" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Systems that outlast their context.</text>
    <text x="618" y="302" font-family="'Courier New',Courier,monospace" font-size="9" fill="#22c55e" opacity="0.68">Disciplined learning. Low noise.</text>
    <!-- Level bar -->
    <rect x="618" y="320" width="262" height="5" rx="1.5" fill="#22c55e" fill-opacity="0.1"/>
    <rect x="618" y="320" width="236" height="5" rx="1.5" fill="#22c55e" opacity="0.65"/>
    <text x="883" y="328" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#22c55e" opacity="0.45">90%</text>
    <text x="618" y="340" font-family="'Courier New',Courier,monospace" font-size="8" fill="#22c55e" opacity="0.3">— durable primitives, disciplined learning, scale planning</text>

    <!-- Column dividers -->
    <line x1="300" y1="50" x2="300" y2="346" stroke="#22c55e" stroke-width="0.4" opacity="0.22"/>
    <line x1="598" y1="50" x2="598" y2="346" stroke="#22c55e" stroke-width="0.4" opacity="0.22"/>
