    <text x="265" y="26" font-family="'Courier New',monospace" font-size="13.5" font-weight="bold" fill="#a855f7" filter="url(#gP2)">DOMAIN ARCHITECTURE // 6 VECTORS</text>
  </g>
  <text x="755" y="25" font-family="'Courier New',monospace" font-size="9.5" fill="#6b6880" opacity=".65">user: Naveenkumar-026</text>
