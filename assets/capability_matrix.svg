  <text x="20" y="112" font-family="'Courier New',monospace" font-size="9" fill="#fca5a5" opacity=".7">Offensive and defensive architectures.</text>
  <text x="20" y="126" font-family="'Courier New',monospace" font-size="9" fill="#fca5a5" opacity=".7">Response automation. Hardening.</text>
