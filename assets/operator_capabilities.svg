<rect x="620" y="10" width="180" height="30" rx="6"/>
<text x="710" y="28" text-anchor="middle">SIGNAL ANALYSIS</text>

<!-- ROW 2 -->

<rect x="120" y="50" width="180" height="30" rx="6"/>
<text x="210" y="68" text-anchor="middle">OSINT INTELLIGENCE</text>

<rect x="320" y="50" width="180" height="30" rx="6"/>
<text x="410" y="68" text-anchor="middle">AUTONOMOUS SYSTEMS</text>

<rect x="520" y="50" width="180" height="30" rx="6"/>
