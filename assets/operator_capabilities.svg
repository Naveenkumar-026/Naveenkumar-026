<svg width="820" height="90" xmlns="http://www.w3.org/2000/svg">

<style>
text{
  font-family: "JetBrains Mono", monospace;
  font-size:12px;
  fill:#c8a6ff;
  letter-spacing:1px;
}
rect{
  fill:#050507;
  stroke:#7c3aed;
  stroke-width:1.2;
}
</style>

<!-- subtle scan animation -->
<rect x="-200" y="0" width="200" height="90" fill="#a855f7" opacity="0.05">
  <animate attributeName="x"
           from="-200"
           to="820"
           dur="6s"
           repeatCount="indefinite"/>
</rect>

<!-- ROW 1 -->

<rect x="50" y="10" width="150" height="30" rx="6"/>
<text x="125" y="28" text-anchor="middle">CYBER DEFENSE</text>

<rect x="220" y="10" width="130" height="30" rx="6"/>
<text x="285" y="28" text-anchor="middle">AI SYSTEMS</text>

<rect x="370" y="10" width="190" height="30" rx="6"/>
<text x="465" y="28" text-anchor="middle">AGENT ARCHITECTURE</text>

<rect x="580" y="10" width="160" height="30" rx="6"/>
<text x="660" y="28" text-anchor="middle">SIGNAL ANALYSIS</text>

<!-- ROW 2 -->

<rect x="140" y="50" width="190" height="30" rx="6"/>
<text x="235" y="68" text-anchor="middle">OSINT INTELLIGENCE</text>

<rect x="350" y="50" width="200" height="30" rx="6"/>
<text x="450" y="68" text-anchor="middle">AUTONOMOUS SYSTEMS</text>

<rect x="570" y="50" width="190" height="30" rx="6"/>
<text x="665" y="68" text-anchor="middle">PRIVACY ENGINEERING</text>

</svg>
