<svg width="820" height="90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tag-text {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #FFFFFF;
        letter-spacing: 1.5px;
      }
      .tag-box {
        fill: #0A0000;
        stroke: #CC0022;
        stroke-width: 1;
      }
      .tag-box-dim {
        fill: #0A0000;
        stroke: #661111;
        stroke-width: 1;
      }
      .tag-text-dim {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #884444;
        letter-spacing: 1.5px;
      }
      .dot {
        fill: #CC0022;
      }
      .dot-dim {
        fill: #441111;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="820" height="90" fill="#000000"/>

  <!-- ROW 1 — 4 tags, evenly spaced, active (bright) -->
  <!-- Tag 1 -->
  <rect x="18"  y="10" width="183" height="28" rx="2" class="tag-box"/>
  <circle cx="32" cy="24" r="2.5" class="dot"/>
  <text x="115" y="29" text-anchor="middle" class="tag-text">CYBER DEFENSE</text>

  <!-- Tag 2 -->
  <rect x="217" y="10" width="183" height="28" rx="2" class="tag-box"/>
  <circle cx="231" cy="24" r="2.5" class="dot"/>
  <text x="314" y="29" text-anchor="middle" class="tag-text">AI SYSTEMS</text>

  <!-- Tag 3 -->
  <rect x="416" y="10" width="183" height="28" rx="2" class="tag-box"/>
  <circle cx="430" cy="24" r="2.5" class="dot"/>
  <text x="513" y="29" text-anchor="middle" class="tag-text">AGENT ARCHITECTURE</text>

  <!-- Tag 4 -->
  <rect x="615" y="10" width="183" height="28" rx="2" class="tag-box"/>
  <circle cx="629" cy="24" r="2.5" class="dot"/>
  <text x="712" y="29" text-anchor="middle" class="tag-text">SIGNAL ANALYSIS</text>

  <!-- ROW 2 — 3 tags, centered, dimmed -->
  <!-- Tag 5 -->
  <rect x="117" y="52" width="183" height="28" rx="2" class="tag-box-dim"/>
  <circle cx="131" cy="66" r="2.5" class="dot-dim"/>
  <text x="214" y="71" text-anchor="middle" class="tag-text-dim">OSINT INTELLIGENCE</text>

  <!-- Tag 6 -->
  <rect x="316" y="52" width="183" height="28" rx="2" class="tag-box-dim"/>
  <circle cx="330" cy="66" r="2.5" class="dot-dim"/>
  <text x="413" y="71" text-anchor="middle" class="tag-text-dim">AUTONOMOUS SYSTEMS</text>

  <!-- Tag 7 -->
  <rect x="515" y="52" width="183" height="28" rx="2" class="tag-box-dim"/>
  <circle cx="529" cy="66" r="2.5" class="dot-dim"/>
  <text x="612" y="71" text-anchor="middle" class="tag-text-dim">PRIVACY ENGINEERING</text>
</svg>
