<svg width="820" height="90" xmlns="http://www.w3.org/2000/svg">

<style>
text{
  font-family:"JetBrains Mono", monospace;
  font-size:12px;
  fill:#c8a6ff;
  letter-spacing:1px;
}
rect{
  fill:#050507;
  stroke:#7c3aed;
  stroke-width:1.2;
}
</style>

<!-- GRID LAYOUT -->
<!-- 4 columns per row, equal spacing -->

