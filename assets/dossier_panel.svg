    <text x="38" y="210" style="animation:mF3 6s 2.1s infinite;opacity:.04">1</text>
    <text x="38" y="234" style="animation:mF  4s .1s  infinite;opacity:.03">ケ</text>
    <text x="38" y="258" style="animation:mF2 5s 1.8s infinite;opacity:.05">0</text>
