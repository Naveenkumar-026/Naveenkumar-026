    <text x="350" y="263" class="m" font-size="7.5" fill="#7733AA" fill-opacity=".7" text-anchor="middle" letter-spacing="1">OSINT</text>
  </g>
  <g style="animation:revealUp .5s .7s ease-out both;opacity:0">
    <rect x="383" y="252" width="96" height="15" rx="1" fill="none" stroke="#1E1E1E"/>
    <text x="431" y="263" class="m" font-size="7.5" fill="#444444" text-anchor="middle" letter-spacing="1">PRIV ENGINEER</text>
  </g>
  <g style="animation:revealUp .5s .85s ease-out both;opacity:0">
