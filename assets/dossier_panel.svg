    <text x="820" y="128" style="animation:mF2 5s .5s  infinite;opacity:.04">ワ</text>
    <text x="820" y="152" style="animation:mF  4s 1.1s infinite;opacity:.03">ネ</text>
    <text x="820" y="176" style="animation:mF3 6s .3s  infinite;opacity:.05">0</text>
    <text x="820" y="200" style="animation:mF  4s 1.7s infinite;opacity:.03">マ</text>
    <text x="820" y="224" style="animation:mF2 5s 2.3s infinite;opacity:.04">1</text>
    <text x="820" y="248" style="animation:mF  4s .4s  infinite;opacity:.03">コ</text>
    <text x="820" y="272" style="animation:mF3 6s 1.9s infinite;opacity:.05">ユ</text>
    <text x="844" y="44"  style="animation:mF  4s 1.3s infinite;opacity:.03">1</text>
    <text x="844" y="68"  style="animation:mF2 5s .9s  infinite;opacity:.04">ハ</text>
    <text x="844" y="92"  style="animation:mF  4s 0s   infinite;opacity:.03">0</text>
    <text x="844" y="116" style="animation:mF3 6s 2.2s infinite;opacity:.05">オ</text>
    <text x="844" y="140" style="animation:mF  4s .7s  infinite;opacity:.03">1</text>
