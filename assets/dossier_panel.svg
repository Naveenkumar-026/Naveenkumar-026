  <filter id="blob"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="c1"><rect width="900" height="420"/></clipPath>
  <style>
    @keyframes scan1 { 0%{transform:translateY(-4px);opacity:0} 5%{opacity:.55} 95%{opacity:.15} 100%{transform:translateY(426px);opacity:0} }
    @keyframes bP    { 0%,100%{opacity:.32} 50%{opacity:.7} }
    @keyframes rP    { 0%,100%{opacity:.55} 50%{opacity:1} }
    @keyframes dB    { 0%,100%{opacity:1}   50%{opacity:.08} }
    @keyframes gl1   { 0%,84%,100%{transform:translate(0,0);filter:none;opacity:1}
                       85%{transform:translate(-3px,0);filter:drop-shadow(3px 0 #ef4444) drop-shadow(-1px 0 #a855f7);opacity:.9}
                       86%{transform:translate(3px,1px);filter:drop-shadow(-3px 0 #4ade80);opacity:.85}
                       87%{transform:translate(-1px,0);filter:drop-shadow(2px 0 #a855f7);opacity:.94}
                       88%{transform:translate(0,0);filter:none;opacity:1}
                       93%{transform:translate(2px,0);filter:drop-shadow(-1px 0 #ef4444);opacity:.9}
                       94%{transform:translate(0,0);filter:none;opacity:1} }
    @keyframes gl2   { 0%,91%,100%{transform:translate(0,0);filter:none}
                       92%{transform:translate(-2px,0);filter:drop-shadow(2px 0 #a855f7)}
                       93%{transform:translate(1px,0);filter:drop-shadow(-1px 0 #ef4444)}
                       94%{transform:translate(0,0);filter:none} }
    @keyframes tf    { 0%,100%{opacity:.48} 50%{opacity:.88} }
    .sc{animation:scan1 7s linear infinite}
    .ob{animation:bP 4.5s ease-in-out infinite}
    .rp{animation:rP 2.8s ease-in-out infinite}
    .db{animation:dB 2s step-end infinite}
    .g1{animation:gl1 10s ease-in-out infinite}
    .g2{animation:gl2 13s ease-in-out infinite 2s}
    .t1{animation:tf 3.5s ease-in-out infinite}
    .t2{animation:tf 3.5s ease-in-out infinite .8s}
    .t3{animation:tf 3.5s ease-in-out infinite 1.6s}
  </style>
