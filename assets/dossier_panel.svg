<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" width="860">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }

      /* --- Glow border pulse --- */
      @keyframes borderPulse {
        0%, 100% { opacity: 0.5; }
        50%       { opacity: 1; }
      }

      /* --- Name glitch: two ghost layers --- */
      @keyframes glitchR {
        0%,88%,100% { opacity:0; transform:translate(0,0); }
        89%  { opacity:0.75; transform:translate(-4px, 0); }
        90%  { opacity:0; }
        92%  { opacity:0.55; transform:translate(3px, 0); }
        93%  { opacity:0; }
      }
      @keyframes glitchC {
        0%,91%,100% { opacity:0; transform:translate(0,0); }
        92%  { opacity:0.6; transform:translate(5px, 0); }
        93%  { opacity:0; }
      }

      /* --- Alias flicker --- */
      @keyframes aliasFlicker {
        0%,94%,100% { opacity:1; }
        95% { opacity:0.15; }
        96% { opacity:1; }
        98% { opacity:0.4; }
        99% { opacity:1; }
      }

      /* --- Status dot blink --- */
      @keyframes dot {
        0%,100% { opacity:1; }
        50%      { opacity:0; }
      }

      /* --- Ticker scroll --- */
      @keyframes ticker {
        0%   { transform: translateX(860px); }
        100% { transform: translateX(-1800px); }
      }

      /* --- Bar grow on load --- */
      @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }

      /* --- Subtle scanline sweep --- */
      @keyframes sweep {
        0%   { transform:translateY(-2px); opacity:0; }
        5%   { opacity:0.04; }
        95%  { opacity:0.04; }
        100% { transform:translateY(380px); opacity:0; }
      }

      /* --- Tag fade in stagger --- */
      @keyframes fadeUp {
        from { opacity:0; transform:translateY(5px); }
        to   { opacity:1; transform:translateY(0); }
      }
    </style>

    <!-- Purple glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft border glow -->
    <filter id="borderGlow" x="-4%" y="-4%" width="108%" height="108%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Bar gradients -->
    <linearGradient id="gradP" x1="0%" x2="100%">
      <stop offset="0%"   stop-color="#6600CC"/>
      <stop offset="75%"  stop-color="#AA55FF"/>
      <stop offset="100%" stop-color="#CC88FF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gradR" x1="0%" x2="100%">
      <stop offset="0%"   stop-color="#880020"/>
      <stop offset="75%"  stop-color="#EE0033"/>
      <stop offset="100%" stop-color="#FF5577" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Clip -->
    <clipPath id="clip"><rect width="860" height="380" rx="3"/></clipPath>
  </defs>

  <!-- ─── Base ─── -->
  <rect width="860" height="380" fill="#070010" rx="3"/>

  <!-- Scanline sweep -->
  <rect x="0" y="0" width="860" height="2" fill="#9933FF"
        style="animation: sweep 7s linear infinite; opacity:0;"/>

  <!-- Very subtle dot grid -->
  <g opacity="0.04" fill="#9933FF">
    <circle cx="80"  cy="60"  r="1"/><circle cx="160" cy="60"  r="1"/>
    <circle cx="240" cy="60"  r="1"/><circle cx="320" cy="60"  r="1"/>
    <circle cx="400" cy="60"  r="1"/><circle cx="480" cy="60"  r="1"/>
    <circle cx="560" cy="60"  r="1"/><circle cx="640" cy="60"  r="1"/>
    <circle cx="720" cy="60"  r="1"/><circle cx="800" cy="60"  r="1"/>
    <circle cx="80"  cy="130" r="1"/><circle cx="160" cy="130" r="1"/>
    <circle cx="240" cy="130" r="1"/><circle cx="320" cy="130" r="1"/>
    <circle cx="400" cy="130" r="1"/><circle cx="480" cy="130" r="1"/>
    <circle cx="560" cy="130" r="1"/><circle cx="640" cy="130" r="1"/>
    <circle cx="720" cy="130" r="1"/><circle cx="800" cy="130" r="1"/>
    <circle cx="80"  cy="200" r="1"/><circle cx="160" cy="200" r="1"/>
    <circle cx="240" cy="200" r="1"/><circle cx="320" cy="200" r="1"/>
    <circle cx="400" cy="200" r="1"/><circle cx="480" cy="200" r="1"/>
    <circle cx="560" cy="200" r="1"/><circle cx="640" cy="200" r="1"/>
    <circle cx="720" cy="200" r="1"/><circle cx="800" cy="200" r="1"/>
    <circle cx="80"  cy="270" r="1"/><circle cx="160" cy="270" r="1"/>
    <circle cx="240" cy="270" r="1"/><circle cx="320" cy="270" r="1"/>
    <circle cx="400" cy="270" r="1"/><circle cx="480" cy="270" r="1"/>
    <circle cx="560" cy="270" r="1"/><circle cx="640" cy="270" r="1"/>
    <circle cx="720" cy="270" r="1"/><circle cx="800" cy="270" r="1"/>
  </g>

  <!-- ─── Outer glow border ─── -->
  <rect x="1" y="1" width="858" height="378" rx="3" fill="none"
        stroke="#7700EE" stroke-width="1.5" filter="url(#borderGlow)"
        style="animation:borderPulse 4s ease-in-out infinite; opacity:0.6;"/>

  <!-- Inner border -->
  <rect x="5" y="5" width="850" height="370" rx="2" fill="none"
        stroke="#2A0055" stroke-width="0.5"/>

  <!-- ─── Header strip ─── -->
  <rect x="0" y="0" width="860" height="26" fill="#0C0018" rx="3"/>
  <rect x="0" y="23" width="860" height="1" fill="#2A0055"/>

  <!-- Header label left -->
  <text x="22" y="16" class="mono"
        font-size="9" fill="#4A0077" letter-spacing="2.5">OPERATOR DOSSIER</text>

  <!-- Live dot + label -->
  <circle cx="800" cy="13" r="3" fill="#00FF88"
          style="animation:dot 2s step-end infinite;"/>
  <text x="808" y="17" class="mono" font-size="8" fill="#00FF88" letter-spacing="1.5">LIVE</text>

  <!-- Classification right -->
  <text x="630" y="16" class="mono" font-size="9" fill="#330055" letter-spacing="2">CLASSIFICATION :: APEX</text>

  <!-- ─── Left accent bar ─── -->
  <rect x="18" y="38" width="1.5" height="240" fill="#1E0033"/>
  <rect x="18" y="38" width="1.5" height="60"  fill="#8800DD" opacity="0.9"/>

  <!-- Alias -->
  <text x="36" y="68" class="mono" font-size="13"
        fill="#EE0033" letter-spacing="9"
        style="animation:aliasFlicker 7s infinite;">
    // SILENCIO
  </text>

  <!-- Rule separator -->
  <line x1="34" y1="80" x2="600" y2="80" stroke="#1E0033" stroke-width="0.8"/>
  <!-- Accent dash on rule -->
  <line x1="34" y1="80" x2="220" y2="80" stroke="#7700CC" stroke-width="1" opacity="0.6"/>
  <polygon points="220,77 234,80 220,83" fill="#7700CC" opacity="0.6"/>

  <!-- ─── Bio ─── -->
  <text x="34" y="101" class="mono" font-size="9.5"
        fill="#8855AA" letter-spacing="0.6">
    Cybersecurity specialist &amp; AI systems architect — defense-first, precision-built.
  </text>
  <text x="34" y="117" class="mono" font-size="9.5"
        fill="#8855AA" letter-spacing="0.6">
    Offensive / defensive security, OSINT, privacy engineering &amp; intelligent automation.
  </text>
  <text x="34" y="133" class="mono" font-size="9.5"
        fill="#8855AA" letter-spacing="0.6">
    Built for high-stakes environments where security, integrity, and execution matter.
  </text>

  <!-- Rule -->
  <line x1="34" y1="146" x2="600" y2="146" stroke="#150025" stroke-width="0.8"/>

  <!-- ─── Key-value fields ─── -->
  <text x="34"  y="163" class="mono" font-size="8.5" fill="#4A0077" letter-spacing="1.5">DOMAIN</text>
  <text x="160" y="163" class="mono" font-size="8.5" fill="#AA77DD" letter-spacing="0.8">Cybersecurity  ·  AI Systems  ·  OSINT  ·  Privacy Engineering</text>

  <text x="34"  y="180" class="mono" font-size="8.5" fill="#4A0077" letter-spacing="1.5">METHOD</text>
  <text x="160" y="180" class="mono" font-size="8.5" fill="#AA77DD" letter-spacing="0.8">Defense-First  ·  Clean Engineering  ·  Rapid Prototyping</text>

  <text x="34"  y="197" class="mono" font-size="8.5" fill="#4A0077" letter-spacing="1.5">CONTEXT</text>
  <text x="160" y="197" class="mono" font-size="8.5" fill="#AA77DD" letter-spacing="0.8">Adversarial  ·  Production-Grade  ·  High-Stakes</text>

  <text x="34"  y="214" class="mono" font-size="8.5" fill="#4A0077" letter-spacing="1.5">BIAS</text>
  <text x="160" y="214" class="mono" font-size="8.5" fill="#AA77DD" letter-spacing="0.8">Signal over noise  ·  Reliability  ·  Execution</text>

  <!-- Rule -->
  <line x1="34" y1="226" x2="600" y2="226" stroke="#150025" stroke-width="0.8"/>

  <!-- ─── Tags ─── -->
  <g style="animation:fadeUp 0.6s 0.2s ease-out both;">
    <rect x="34"  y="236" width="90" height="16" rx="2" fill="#1A0033"/>
    <text x="79"  y="248" class="mono" font-size="8" fill="#9955CC" text-anchor="middle" letter-spacing="1">OFFENSIVE SEC</text>
  </g>
  <g style="animation:fadeUp 0.6s 0.4s ease-out both;">
    <rect x="132" y="236" width="90" height="16" rx="2" fill="#1A0010"/>
    <text x="177" y="248" class="mono" font-size="8" fill="#CC4466" text-anchor="middle" letter-spacing="1">DEFENSIVE SEC</text>
  </g>
  <g style="animation:fadeUp 0.6s 0.6s ease-out both;">
    <rect x="230" y="236" width="90" height="16" rx="2" fill="#1A0033"/>
    <text x="275" y="248" class="mono" font-size="8" fill="#9955CC" text-anchor="middle" letter-spacing="1">AI ARCHITECT</text>
  </g>
  <g style="animation:fadeUp 0.6s 0.8s ease-out both;">
    <rect x="328" y="236" width="52" height="16" rx="2" fill="#1A0010"/>
    <text x="354" y="248" class="mono" font-size="8" fill="#CC4466" text-anchor="middle" letter-spacing="1">OSINT</text>
  </g>
  <g style="animation:fadeUp 0.6s 1.0s ease-out both;">
    <rect x="388" y="236" width="104" height="16" rx="2" fill="#1A0033"/>
    <text x="440" y="248" class="mono" font-size="8" fill="#9955CC" text-anchor="middle" letter-spacing="1">PRIV ENGINEER</text>
  </g>
  <g style="animation:fadeUp 0.6s 1.2s ease-out both;">
    <rect x="500" y="236" width="84" height="16" rx="2" fill="#1A0010"/>
    <text x="542" y="248" class="mono" font-size="8" fill="#CC4466" text-anchor="middle" letter-spacing="1">AUTOMATION</text>
  </g>

  <!-- ─── Right panel: Skill bars ─── -->
  <rect x="634" y="36" width="210" height="296" rx="2" fill="#080012"/>
  <line x1="634" y1="36" x2="844" y2="36" stroke="#2A0055" stroke-width="0.5"/>

  <text x="644" y="56" class="mono" font-size="8.5" fill="#4A0077" letter-spacing="2">PROFICIENCY INDEX</text>
  <line x1="644" y1="62" x2="834" y2="62" stroke="#1E0033" stroke-width="0.5"/>

  <!-- Bar macro: track + fill + label -->
  <!-- Bar 1 -->
  <text x="644" y="82"  class="mono" font-size="8" fill="#9966BB" letter-spacing="0.8">Offensive Security</text>
  <text x="820" y="82"  class="mono" font-size="8" fill="#EE0033">97</text>
  <rect  x="644" y="85"  width="190" height="5" rx="1" fill="#110020"/>
  <g style="animation:grow 1.4s 0.1s ease-out both; transform-origin:644px 0;">
    <rect x="644" y="85" width="184" height="5" rx="1" fill="url(#gradR)"/>
  </g>

  <!-- Bar 2 -->
  <text x="644" y="104" class="mono" font-size="8" fill="#9966BB" letter-spacing="0.8">Defensive Systems</text>
  <text x="820" y="104" class="mono" font-size="8" fill="#AA55FF">95</text>
  <rect  x="644" y="107" width="190" height="5" rx="1" fill="#110020"/>
  <g style="animation:grow 1.4s 0.3s ease-out both; transform-origin:644px 0;">
    <rect x="644" y="107" width="180" height="5" rx="1" fill="url(#gradP)"/>
  </g>

  <!-- Bar 3 -->
  <text x="644" y="126" class="mono" font-size="8" fill="#9966BB" letter-spacing="0.8">AI Architecture</text>
  <text x="820" y="126" class="mono" font-size="8" fill="#EE0033">93</text>
  <rect  x="644" y="129" width="190" height="5" rx="1" fill="#110020"/>
  <g style="animation:grow 1.4s 0.5s ease-out both; transform-origin:644px 0;">
    <rect x="644" y="129" width="177" height="5" rx="1" fill="url(#gradR)"/>
  </g>

  <!-- Bar 4 -->
  <text x="644" y="148" class="mono" font-size="8" fill="#9966BB" letter-spacing="0.8">OSINT &amp; Intel</text>
  <text x="820" y="148" class="mono" font-size="8" fill="#AA55FF">96</text>
  <rect  x="644" y="151" width="190" height="5" rx="1" fill="#110020"/>
  <g style="animation:grow 1.4s 0.7s ease-out both; transform-origin:644px 0;">
    <rect x="644" y="151" width="182" height="5" rx="1" fill="url(#gradP)"/>
  </g>

  <!-- Bar 5 -->
  <text x="644" y="170" class="mono" font-size="8" fill="#9966BB" letter-spacing="0.8">Privacy Engineering</text>
  <text x="820" y="170" class="mono" font-size="8" fill="#EE0033">91</text>
  <rect  x="644" y="173" width="190" height="5" rx="1" fill="#110020"/>
  <g style="animation:grow 1.4s 0.9s ease-out both; transform-origin:644px 0;">
    <rect x="644" y="173" width="173" height="5" rx="1" fill="url(#gradR)"/>
  </g>

  <!-- Bar 6 -->
  <text x="644" y="192" class="mono" font-size="8" fill="#9966BB" letter-spacing="0.8">Automation &amp; Agents</text>
  <text x="820" y="192" class="mono" font-size="8" fill="#AA55FF">94</text>
  <rect  x="644" y="195" width="190" height="5" rx="1" fill="#110020"/>
  <g style="animation:grow 1.4s 1.1s ease-out both; transform-origin:644px 0;">
    <rect x="644" y="195" width="178" height="5" rx="1" fill="url(#gradP)"/>
  </g>

  <!-- Divider in right panel -->
  <line x1="644" y1="212" x2="834" y2="212" stroke="#1E0033" stroke-width="0.5"/>

  <!-- Doctrine lines in right panel -->
  <text x="644" y="228" class="mono" font-size="8.5" fill="#4A0077" letter-spacing="2">DOCTRINE</text>
  <line x1="644" y1="234" x2="834" y2="234" stroke="#1E0033" stroke-width="0.5"/>

  <text x="644" y="250" class="mono" font-size="8" fill="#553377" letter-spacing="0.5">Defense before features.</text>
  <text x="644" y="265" class="mono" font-size="8" fill="#553377" letter-spacing="0.5">Threat model first, always.</text>
  <text x="644" y="280" class="mono" font-size="8" fill="#553377" letter-spacing="0.5">Execution is the metric.</text>
  <text x="644" y="295" class="mono" font-size="8" fill="#553377" letter-spacing="0.5">Adversarial mindset, always on.</text>
  <text x="644" y="310" class="mono" font-size="8" fill="#553377" letter-spacing="0.5">Signal over noise. Always.</text>

  <!-- ─── Bottom ticker bar ─── -->
  <rect x="0" y="353" width="860" height="18" fill="#0C0018"/>
  <line x1="5" y1="353" x2="855" y2="353" stroke="#2A0055" stroke-width="0.5"/>
  <text y="365" class="mono" font-size="7.5" fill="#330055" letter-spacing="2"
        style="animation:ticker 20s linear infinite;">
    ∷ SECURITY · INTELLIGENCE · AUTONOMY  ∷  DEFENSE-FIRST · SIGNAL OVER NOISE · BUILD DURABLE SYSTEMS  ∷  NAVEEN KUMAR M // SILENCIO  ∷  CYBERSECURITY · AI SYSTEMS · OSINT · PRIVACY ENGINEERING
  </text>
  <!-- Static labels over ticker -->
  <text x="18"  y="365" class="mono" font-size="7" fill="#2A0044">SYS::ACTIVE</text>
  <text x="770" y="365" class="mono" font-size="7" fill="#2A0044">ID::SILENCIO</text>
</svg>
