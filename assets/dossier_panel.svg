<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020704"/>
      <stop offset="100%" stop-color="#050d06"/>
    </linearGradient>
    <pattern id="gridP" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#22c55e" stroke-width="0.18" opacity="0.18"/>
    </pattern>
    <filter id="glow0">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip0"><rect width="900" height="420"/></clipPath>
    <style>
      @keyframes scanAnim {
        0%   { transform: translateY(-10px); opacity: 0; }
        5%   { opacity: 0.6; }
        95%  { opacity: 0.2; }
        100% { transform: translateY(430px); opacity: 0; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.5; r: 3.5; }
        50% { opacity: 1; r: 5; }
      }
      @keyframes tagFade {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.9; }
      }
      .scan { animation: scanAnim 7s linear infinite; }
      .blink { animation: blinkCursor 1.1s step-end infinite; }
      .pdot { animation: dotPulse 2.2s ease-in-out infinite; }
      .tfade { animation: tagFade 3s ease-in-out infinite; }
      .tfade2 { animation: tagFade 3s ease-in-out infinite 0.8s; }
      .tfade3 { animation: tagFade 3s ease-in-out infinite 1.6s; }
    </style>
  </defs>

  <g clip-path="url(#clip0)">
