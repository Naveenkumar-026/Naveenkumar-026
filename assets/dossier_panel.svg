  <!-- Bio -->
  <text x="33" y="132" class="m" font-size="9.5" fill="#CCCCCC" letter-spacing=".5">Defense-first builder operating across offensive/defensive security, OSINT, privacy</text>
  <text x="33" y="149" class="m" font-size="9.5" fill="#CCCCCC" letter-spacing=".5">engineering, and intelligent automation. Bias toward real-world reliability and clean</text>
