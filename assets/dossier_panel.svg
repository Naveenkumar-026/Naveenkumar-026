<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" width="860">
  <defs>
    <style>
      .m { font-family: 'Courier New', Courier, monospace; }

      @keyframes borderPulse {
        0%,100% { opacity:.45; } 50% { opacity:.9; }
      }
      @keyframes aliasPulse {
        0%,94%,100% { opacity:1; } 95% { opacity:.1; } 96% { opacity:1; } 98% { opacity:.3; } 99% { opacity:1; }
      }
      @keyframes glitchR {
        0%,91%,100% { opacity:0; transform:translate(0,0); }
        92% { opacity:.7; transform:translate(-3px,0); }
        93% { opacity:0; }
        95% { opacity:.5; transform:translate(4px,0); }
        96% { opacity:0; }
      }
      @keyframes dotBlink { 0%,100% { opacity:1; } 50% { opacity:0; } }
      @keyframes ticker { 0% { transform:translateX(860px); } 100% { transform:translateX(-2400px); } }
      @keyframes mF  { 0%,100% { opacity:.03; } 50% { opacity:.07; } }
      @keyframes mF2 { 0%,100% { opacity:.05; } 50% { opacity:.02; } }
      @keyframes mF3 { 0%,100% { opacity:.04; } 40% { opacity:.08; } }
      @keyframes revealUp {
        from { opacity:0; transform:translateY(6px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes scanSweep {
        0% { transform:translateY(-2px); opacity:0; }
        4% { opacity:.035; } 96% { opacity:.035; }
        100% { transform:translateY(300px); opacity:0; }
      }
    </style>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="borderGlow" x="-6%" y="-6%" width="112%" height="112%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="860" height="300" fill="#000000"/>

  <!-- Matrix glyphs — red column left -->
  <g class="m" font-size="11" fill="#CC2244">
    <text x="14" y="28"  style="animation:mF  4s 0s   infinite;opacity:.03">ア</text>
    <text x="14" y="52"  style="animation:mF  4s .4s  infinite;opacity:.05">1</text>
    <text x="14" y="76"  style="animation:mF2 5s .8s  infinite;opacity:.04">ヲ</text>
    <text x="14" y="100" style="animation:mF  4s 1.2s infinite;opacity:.03">0</text>
    <text x="14" y="124" style="animation:mF3 6s .2s  infinite;opacity:.05">ナ</text>
    <text x="14" y="148" style="animation:mF  4s 1.6s infinite;opacity:.03">1</text>
    <text x="14" y="172" style="animation:mF2 5s 2s   infinite;opacity:.04">ス</text>
    <text x="14" y="196" style="animation:mF  4s .6s  infinite;opacity:.03">0</text>
    <text x="14" y="220" style="animation:mF3 6s 1s   infinite;opacity:.05">チ</text>
    <text x="14" y="244" style="animation:mF  4s 2.4s infinite;opacity:.03">ン</text>
    <text x="14" y="268" style="animation:mF2 5s 1.4s infinite;opacity:.04">1</text>
    <text x="38" y="18"  style="animation:mF3 6s .5s  infinite;opacity:.04">シ</text>
    <text x="38" y="42"  style="animation:mF  4s 1s   infinite;opacity:.03">0</text>
    <text x="38" y="66"  style="animation:mF2 5s 1.5s infinite;opacity:.05">レ</text>
    <text x="38" y="90"  style="animation:mF  4s .3s  infinite;opacity:.03">1</text>
    <text x="38" y="114" style="animation:mF3 6s .9s  infinite;opacity:.04">ム</text>
