    <rect x="33"  y="252" width="92" height="15" rx="1" fill="none" stroke="#1E1E1E"/>
    <text x="79"  y="263" class="m" font-size="7.5" fill="#444444" text-anchor="middle" letter-spacing="1">OFFENSIVE SEC</text>
  </g>
  <g style="animation:revealUp .5s .25s ease-out both;opacity:0">
    <rect x="133" y="252" width="92" height="15" rx="1" fill="none" stroke="#FF1133" stroke-opacity=".3"/>
    <text x="179" y="263" class="m" font-size="7.5" fill="#FF1133" fill-opacity=".6" text-anchor="middle" letter-spacing="1">DEFENSIVE SEC</text>
  </g>
  <g style="animation:revealUp .5s .4s ease-out both;opacity:0">
