  <pattern id="gridP" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a855f7" stroke-width="0.14" opacity="0.14"/>
  </pattern>
  <filter id="gP">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
