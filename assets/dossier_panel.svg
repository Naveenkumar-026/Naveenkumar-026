<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" width="860">
  <defs>
    <style>
      .m  { font-family: 'Courier New', Courier, monospace; }

      @keyframes borderBreath {
        0%,100% { opacity:.3; } 50% { opacity:.75; }
      }
      @keyframes redBreath {
        0%,100% { opacity:.5; } 50% { opacity:1; }
      }
      @keyframes dotBlink {
        0%,100% { opacity:1; } 50% { opacity:0; }
      }
      @keyframes ticker {
        0% { transform:translateX(860px); }
        100% { transform:translateX(-2600px); }
      }
      @keyframes sweep {
        0%   { transform:translateY(-2px); opacity:0; }
        5%   { opacity:.03; }
        95%  { opacity:.03; }
        100% { transform:translateY(340px); opacity:0; }
      }

      /* Glyph pulse — 3 distinct timings */
      @keyframes gA { 0%,100%{opacity:.03} 50%{opacity:.07} }
      @keyframes gB { 0%,100%{opacity:.05} 50%{opacity:.02} }
      @keyframes gC { 0%,100%{opacity:.04} 40%{opacity:.08} }

      /* ── Text reveal: staggered fade-up ── */
      @keyframes up {
        from { opacity:0; transform:translateY(8px); }
        to   { opacity:1; transform:translateY(0);   }
      }

      /* Header glitch ghost */
      @keyframes ghost {
        0%,92%,100% { opacity:0; transform:translate(0,0); }
        93% { opacity:.6; transform:translate(-4px,0); }
        94% { opacity:0; }
        96% { opacity:.4; transform:translate(5px,0); }
        97% { opacity:0; }
      }

      /* Separator creep */
      @keyframes lineGrow {
        from { stroke-dashoffset: 600; }
        to   { stroke-dashoffset: 0;   }
      }
      .sep { stroke-dasharray:600; stroke-dashoffset:600; }
      .sep1 { animation: lineGrow 1.2s .4s ease-out forwards; }
      .sep2 { animation: lineGrow 1.2s 1.2s ease-out forwards; }
      .sep3 { animation: lineGrow 1.2s 2.4s ease-out forwards; }

      /* Cursor blink after last line */
      @keyframes cur {
        0%,100% { opacity:1; } 50% { opacity:0; }
      }
    </style>

    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="borderGlow" x="-6%" y="-6%" width="112%" height="112%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Base ── -->
  <rect width="860" height="340" fill="#000000"/>

  <!-- ── Matrix glyphs — red, left edge ── -->
  <g class="m" font-size="11" fill="#CC2244">
    <text x="6"  y="30"  style="animation:gA 4.1s 0.0s infinite;opacity:.03">ア</text>
    <text x="6"  y="55"  style="animation:gB 5.3s 0.6s infinite;opacity:.04">1</text>
    <text x="6"  y="80"  style="animation:gC 6.0s 1.2s infinite;opacity:.03">ヲ</text>
    <text x="6"  y="105" style="animation:gA 4.7s 0.3s infinite;opacity:.05">0</text>
    <text x="6"  y="130" style="animation:gB 5.1s 1.8s infinite;opacity:.03">ナ</text>
    <text x="6"  y="155" style="animation:gC 6.4s 0.9s infinite;opacity:.04">1</text>
    <text x="6"  y="180" style="animation:gA 4.3s 2.1s infinite;opacity:.03">ス</text>
    <text x="6"  y="205" style="animation:gB 5.7s 0.4s infinite;opacity:.05">0</text>
    <text x="6"  y="230" style="animation:gC 6.2s 1.5s infinite;opacity:.03">チ</text>
    <text x="6"  y="255" style="animation:gA 4.9s 2.7s infinite;opacity:.04">ン</text>
    <text x="6"  y="280" style="animation:gB 5.5s 0.7s infinite;opacity:.03">1</text>
    <text x="6"  y="305" style="animation:gC 6.1s 1.1s infinite;opacity:.05">ル</text>
    <text x="22" y="18"  style="animation:gA 4.4s 0.5s infinite;opacity:.04">シ</text>
    <text x="22" y="43"  style="animation:gB 5.2s 1.3s infinite;opacity:.03">0</text>
    <text x="22" y="68"  style="animation:gC 6.3s 2.0s infinite;opacity:.05">レ</text>
    <text x="22" y="93"  style="animation:gA 4.6s 0.8s infinite;opacity:.03">1</text>
    <text x="22" y="118" style="animation:gB 5.4s 1.6s infinite;opacity:.04">ム</text>
    <text x="22" y="143" style="animation:gC 6.0s 0.2s infinite;opacity:.03">0</text>
    <text x="22" y="168" style="animation:gA 4.2s 2.4s infinite;opacity:.05">ト</text>
    <text x="22" y="193" style="animation:gB 5.6s 1.0s infinite;opacity:.03">ラ</text>
    <text x="22" y="218" style="animation:gC 6.5s 0.6s infinite;opacity:.04">1</text>
    <text x="22" y="243" style="animation:gA 4.8s 1.9s infinite;opacity:.03">ケ</text>
    <text x="22" y="268" style="animation:gB 5.0s 2.2s infinite;opacity:.05">0</text>
    <text x="22" y="293" style="animation:gC 6.2s 0.4s infinite;opacity:.03">ヒ</text>
  </g>

  <!-- ── Matrix glyphs — purple, right edge ── -->
  <g class="m" font-size="11" fill="#6622AA">
    <text x="832" y="30"  style="animation:gB 5.3s 0.2s infinite;opacity:.04">ヨ</text>
    <text x="832" y="55"  style="animation:gA 4.1s 0.9s infinite;opacity:.03">0</text>
    <text x="832" y="80"  style="animation:gC 6.4s 1.5s infinite;opacity:.05">フ</text>
    <text x="832" y="105" style="animation:gA 4.7s 2.1s infinite;opacity:.03">1</text>
    <text x="832" y="130" style="animation:gB 5.1s 0.5s infinite;opacity:.04">ワ</text>
    <text x="832" y="155" style="animation:gC 6.0s 1.2s infinite;opacity:.03">ネ</text>
    <text x="832" y="180" style="animation:gA 4.5s 2.6s infinite;opacity:.05">0</text>
    <text x="832" y="205" style="animation:gB 5.8s 0.8s infinite;opacity:.03">マ</text>
    <text x="832" y="230" style="animation:gC 6.3s 1.7s infinite;opacity:.04">1</text>
    <text x="832" y="255" style="animation:gA 4.9s 0.3s infinite;opacity:.03">コ</text>
    <text x="832" y="280" style="animation:gB 5.5s 2.0s infinite;opacity:.05">ユ</text>
    <text x="832" y="305" style="animation:gC 6.1s 1.4s infinite;opacity:.03">カ</text>
    <text x="848" y="43"  style="animation:gA 4.3s 1.3s infinite;opacity:.04">1</text>
    <text x="848" y="68"  style="animation:gB 5.2s 0.6s infinite;opacity:.03">ハ</text>
    <text x="848" y="93"  style="animation:gC 6.5s 1.9s infinite;opacity:.05">0</text>
    <text x="848" y="118" style="animation:gA 4.6s 2.4s infinite;opacity:.03">オ</text>
    <text x="848" y="143" style="animation:gB 5.7s 0.1s infinite;opacity:.04">1</text>
    <text x="848" y="168" style="animation:gC 6.2s 1.6s infinite;opacity:.03">ク</text>
    <text x="848" y="193" style="animation:gA 4.4s 2.8s infinite;opacity:.05">0</text>
    <text x="848" y="218" style="animation:gB 5.0s 0.7s infinite;opacity:.03">セ</text>
    <text x="848" y="243" style="animation:gC 6.4s 1.1s infinite;opacity:.04">1</text>
    <text x="848" y="268" style="animation:gA 4.8s 2.3s infinite;opacity:.03">ノ</text>
    <text x="848" y="293" style="animation:gB 5.3s 0.9s infinite;opacity:.05">ミ</text>
  </g>

  <!-- Sparse center glyphs — barely there -->
  <g class="m" font-size="9" fill="#FFFFFF">
    <text x="110" y="42"  style="animation:gC 7s 1.0s infinite;opacity:.015">テ</text>
    <text x="310" y="28"  style="animation:gA 5s 2.1s infinite;opacity:.015">0</text>
    <text x="510" y="38"  style="animation:gB 6s 0.5s infinite;opacity:.015">ヌ</text>
    <text x="710" y="25"  style="animation:gC 5s 1.7s infinite;opacity:.015">1</text>
    <text x="200" y="320" style="animation:gA 7s 0.3s infinite;opacity:.015">ロ</text>
    <text x="420" y="315" style="animation:gB 5s 1.9s infinite;opacity:.015">0</text>
    <text x="640" y="318" style="animation:gC 6s 0.8s infinite;opacity:.015">1</text>
  </g>

  <!-- ── Scanline sweep ── -->
  <rect x="0" y="0" width="860" height="2" fill="#FF1133"
        style="animation:sweep 10s linear infinite;opacity:0"/>

  <!-- ── Borders ── -->
  <rect x="1" y="1" width="858" height="338" rx="2" fill="none"
        stroke="#FFFFFF" stroke-width="1.2" filter="url(#borderGlow)"
        style="animation:borderBreath 5s ease-in-out infinite;opacity:.3"/>
  <rect x="1" y="1" width="858" height="338" rx="2" fill="none"
        stroke="#1C1C1C" stroke-width="1"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="860" height="24" fill="#050505"/>
  <rect x="0" y="23" width="860" height="1" fill="#181818"/>
  <text x="22" y="15" class="m" font-size="8" fill="#2A2A2A" letter-spacing="2.5">OPERATOR DOSSIER // SILENCIO</text>
  <circle cx="810" cy="12" r="2.5" fill="#00FF88" style="animation:dotBlink 2s step-end infinite"/>
  <text x="818" y="15.5" class="m" font-size="7.5" fill="#00FF88" letter-spacing="1.5">LIVE</text>

  <!-- ── Content: centered, breathing room ── -->

  <!-- SECTION 1 — Identity -->
  <line x1="44" y1="50" x2="816" y2="50"
        stroke="#FF1133" stroke-width=".6" opacity=".4" class="sep sep1"/>

  <g style="animation:up .7s .6s ease-out both;opacity:0">
    <text x="44" y="76" class="m" font-size="11" fill="#333333" letter-spacing="3">SUBJECT</text>
    <text x="120" y="76" class="m" font-size="11" fill="#FFFFFF" letter-spacing="3">SILENCIO</text>
    <text x="240" y="76" class="m" font-size="11" fill="#333333" letter-spacing="2">·</text>
    <text x="260" y="76" class="m" font-size="11" fill="#555555" letter-spacing="2">THREAT CLASS: ARCHITECT</text>
  </g>

  <g style="animation:up .7s .9s ease-out both;opacity:0">
    <!-- Ghost layer for header glitch -->
    <text x="44" y="110" class="m" font-size="28" font-weight="bold"
          fill="#FF1133" letter-spacing="1" opacity="0"
          style="animation:ghost 8s 1s infinite">
      NOT A HACKER. AN ARCHITECT OF SILENCE.
    </text>
    <!-- Glow -->
    <text x="44" y="110" class="m" font-size="28" font-weight="bold"
          fill="#FF1133" letter-spacing="1" filter="url(#redGlow)" opacity=".15"
          style="animation:redBreath 5s ease-in-out infinite">
      NOT A HACKER. AN ARCHITECT OF SILENCE.
    </text>
    <!-- Solid -->
    <text x="44" y="110" class="m" font-size="28" font-weight="bold"
          fill="#FFFFFF" letter-spacing="1">
      NOT A HACKER. AN ARCHITECT OF SILENCE.
    </text>
  </g>

  <!-- SECTION 2 — The creed -->
  <line x1="44" y1="130" x2="816" y2="130"
        stroke="#1E1E1E" stroke-width=".8" class="sep sep2"/>

  <g style="animation:up .6s 1.3s ease-out both;opacity:0">
    <text x="44" y="158" class="m" font-size="13" fill="#888888" letter-spacing=".8">
      The best attack leaves no trace.
    </text>
    <text x="510" y="158" class="m" font-size="13" fill="#FF1133" fill-opacity=".5" letter-spacing=".8">
      The best defense was never seen.
    </text>
  </g>

  <g style="animation:up .6s 1.7s ease-out both;opacity:0">
    <text x="44" y="182" class="m" font-size="13" fill="#555555" letter-spacing=".8">
      He does not announce himself.
    </text>
    <text x="390" y="182" class="m" font-size="13" fill="#AAAAAA" letter-spacing=".8">
      He arrives in the logs after the fact.
    </text>
  </g>

  <g style="animation:up .6s 2.1s ease-out both;opacity:0">
    <text x="44" y="206" class="m" font-size="13" fill="#888888" letter-spacing=".8">
      The threat was already inside
    </text>
    <text x="340" y="206" class="m" font-size="13" fill="#FF1133" fill-opacity=".6" letter-spacing=".8">
      when you started looking.
    </text>
  </g>

  <!-- SECTION 3 — Maxims -->
  <line x1="44" y1="226" x2="816" y2="226"
        stroke="#1E1E1E" stroke-width=".8" class="sep sep3"/>

  <g style="animation:up .5s 2.6s ease-out both;opacity:0">
    <text x="44"  y="250" class="m" font-size="9" fill="#FF1133" fill-opacity=".5" letter-spacing="1">01</text>
    <text x="72"  y="250" class="m" font-size="9" fill="#444444" letter-spacing="1">Silence is not absence.</text>
    <text x="310" y="250" class="m" font-size="9" fill="#444444" letter-spacing="1">It is</text>
    <text x="346" y="250" class="m" font-size="9" fill="#CCCCCC" letter-spacing="1">precision under cover.</text>
  </g>
  <g style="animation:up .5s 2.9s ease-out both;opacity:0">
    <text x="44"  y="268" class="m" font-size="9" fill="#6622AA" fill-opacity=".6" letter-spacing="1">02</text>
    <text x="72"  y="268" class="m" font-size="9" fill="#444444" letter-spacing="1">Security is not a product.</text>
    <text x="344" y="268" class="m" font-size="9" fill="#444444" letter-spacing="1">It is</text>
    <text x="380" y="268" class="m" font-size="9" fill="#CCCCCC" letter-spacing="1">a discipline you never complete.</text>
  </g>
  <g style="animation:up .5s 3.2s ease-out both;opacity:0">
    <text x="44"  y="286" class="m" font-size="9" fill="#FF1133" fill-opacity=".5" letter-spacing="1">03</text>
    <text x="72"  y="286" class="m" font-size="9" fill="#444444" letter-spacing="1">Intelligence without action is noise.</text>
    <text x="440" y="286" class="m" font-size="9" fill="#CCCCCC" letter-spacing="1">Action without intelligence is ruin.</text>
  </g>
  <g style="animation:up .5s 3.5s ease-out both;opacity:0">
    <text x="44"  y="304" class="m" font-size="9" fill="#6622AA" fill-opacity=".6" letter-spacing="1">04</text>
    <text x="72"  y="304" class="m" font-size="9" fill="#CCCCCC" letter-spacing="1">Every system has a seam.</text>
    <text x="288" y="304" class="m" font-size="9" fill="#444444" letter-spacing="1">I find them. I close them. I remember them.</text>
  </g>

  <!-- Blinking cursor at end -->
  <g style="animation:up .5s 3.8s ease-out both;opacity:0">
    <text x="44" y="319" class="m" font-size="9" fill="#FF1133" fill-opacity=".4">$</text>
    <rect x="57" y="309" width="7" height="12" fill="#FF1133" fill-opacity=".5"
          style="animation:cur 1s 3.8s step-end infinite"/>
  </g>

  <!-- ── Bottom ticker ── -->
  <rect x="0" y="322" width="860" height="18" fill="#040404"/>
  <line x1="0" y1="322" x2="860" y2="322" stroke="#141414" stroke-width="1"/>
  <text y="334" class="m" font-size="7.5" fill="#1E1E1E" letter-spacing="2"
        style="animation:ticker 26s linear infinite">
    ∷  NOT A HACKER — AN ARCHITECT OF SILENCE  ∷  THE BEST DEFENSE WAS NEVER SEEN  ∷  EVERY SYSTEM HAS A SEAM  ∷  INTELLIGENCE WITHOUT ACTION IS NOISE  ∷  SILENCIO // OPERATOR  ∷  ORDO AB CHAO  ∷
  </text>
  <text x="20"  y="334" class="m" font-size="7" fill="#181818">SYS::ACTIVE</text>
  <text x="760" y="334" class="m" font-size="7" fill="#181818">UPTIME::∞</text>
</svg>
