    <stop offset="50%"  stop-color="#080008"/>
    <stop offset="100%" stop-color="#030003"/>
  </linearGradient>
  <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#1a0035" stop-opacity="0.9"/>
    <stop offset="50%"  stop-color="#0d0020" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#1a0035" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="lPanelBg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#0e0025" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#050010" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="rPanelBg" x1="0%" y1="0%" x2="100%" y2="0%">
