d="M0 60 Q80 20 160 60 T320 60 T480 60 T640 60 T800 60 T960 60 T1120 60 T1200 60">
<animate attributeName="d" dur="2.4s" repeatCount="indefinite"
values="
M0 60 Q80 20 160 60 T320 60 T480 60 T640 60 T800 60 T960 60 T1120 60 T1200 60;
M0 60 Q80 95 160 60 T320 60 T480 60 T640 60 T800 60 T960 60 T1120 60 T1200 60;
