name: Signal Telemetry

on:
  schedule:
    - cron: "15 18 * * *"  # daily (UTC) - adjust if you want
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Signal SVG
        env:
          GH_USER: Naveenkumar-026
          # Prefer PAT for accurate contribution totals (esp. private); fallback to GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.SIGNAL_TOKEN || secrets.GITHUB_TOKEN }}
          OUT_PATH: assets/signal_barcode.svg
          INCLUDE_PRIVATE: "true"
        run: |
          python scripts/signal_telemetry.py
          ls -la assets || true

      - name: Generate Hero Sweep
        env:
          OUT_PATH: assets/hero_sweep.svg
        run: |
          python scripts/hero_sweep.py

      - name: Bump README cache keys
        run: |
          python - << 'PY'
          import time, re, pathlib
          v = str(int(time.time()))
          p = pathlib.Path("README.md")
          s = p.read_text(encoding="utf-8")

          s = re.sub(r'(\./assets/signal_barcode\.svg)(\?v=\d+)?', r'\1?v='+v, s)
          s = re.sub(r'(\./assets/hero_sweep\.svg)(\?v=\d+)?', r'\1?v='+v, s)

          p.write_text(s, encoding="utf-8")
          print("README cache-bust version:", v)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          git commit -m "chore: update signal telemetry" || exit 0
          git push
