name: Signal Telemetry

on:
  schedule:
    - cron: "15 18 * * *"  # daily (UTC) - adjust if you want
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SVG
        env:
          GH_USER: Naveenkumar-026
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_PATH: assets/signal_barcode.svg
        run: |
          python scripts/signal_telemetry.py
          ls -la assets || true

      - name: Generate Hero Sweep
        env:
          OUT_PATH: assets/hero_sweep.svg
        run: |
          python scripts/hero_sweep.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: update signal telemetry" || exit 0
          git push

