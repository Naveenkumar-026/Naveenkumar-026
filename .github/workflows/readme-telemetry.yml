name: Update README telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"   # hourly (UTC). Change to daily if you want.

permissions:
  contents: write

concurrency:
  group: readme-telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Render SVGs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.SIGNAL_TOKEN }}
        run: |
          python scripts/signal_telemetry.py
          python scripts/constellation_map.py

      # Optional but strongly recommended: cache-bust so GitHub’s image proxy shows the newest SVG fast
      - name: Cache-bust README image URLs
        run: |
          python - <<'PY'
          import re, pathlib, time
          p = pathlib.Path("README.md")
          s = p.read_text(encoding="utf-8")
          v = str(int(time.time()))
          s = re.sub(r'(\./assets/signal_barcode\.svg)(\?v=\d+)?', r'\1?v='+v, s)
          s = re.sub(r'(\./assets/constellation\.svg)(\?v=\d+)?', r'\1?v='+v, s)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          git commit -m "chore: update README telemetry"
          git push
