name: Update README telemetry

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render SVGs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.SIGNAL_TOKEN || secrets.GITHUB_TOKEN }}
          TZ_OFFSET_MINUTES: "330"
        run: |
          OUT_PATH=assets/signal_barcode.svg python scripts/signal_telemetry.py
          OUT_PATH=assets/hero_sweep.svg python scripts/hero_sweep.py

      - name: Cache-bust README image URLs
        run: |
          python - << 'PY'
          import time, re, pathlib
          v = str(int(time.time()))
          p = pathlib.Path("README.md")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'(\./assets/signal_barcode\.svg)(\?v=\d+)?', r'\1?v='+v, s)
          s = re.sub(r'(\./assets/hero_sweep\.svg)(\?v=\d+)?', r'\1?v='+v, s)
          p.write_text(s, encoding="utf-8")
          print("README cache-bust:", v)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg README.md
          git commit -m "chore: update README telemetry" || exit 0
          git push
